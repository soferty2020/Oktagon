name: CI

# PR не должен мержиться при failed lint/test/build (docs/16-testing.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Тестовый контур: значения не секреты, используются только в CI.
  DATABASE_URL: postgresql://octagon:octagon@localhost:5432/octagon?schema=public
  TEST_DATABASE_URL: postgresql://octagon:octagon@localhost:5432/octagon_test
  REDIS_URL: redis://localhost:6379
  TEST_REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
  JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters

jobs:
  verify:
    name: lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Версия совпадает с docker-compose.yml и docs/14-infrastructure.md.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octagon
          POSTGRES_PASSWORD: octagon
          POSTGRES_DB: octagon
          TZ: UTC
          # Та же collation, что в docker-compose.yml: иначе регистронезависимый
          # поиск по кириллице ведет себя по-разному на разных стендах.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=en-US'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octagon -d octagon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Redis нужен для rate limiting auth-эндпоинтов (docs/15-security.md).
        # Локально допускается версия 5, в CI используется 7 как в compose.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: Prisma Client генерируется отдельным шагом в
        # apps/api/generated/prisma (см. docs/27-local-development.md).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build packages
        # Пакеты отдают только собранный dist (`main` и `types` в package.json
        # указывают на dist), а typecheck и тесты API резолвят @octagon/contracts
        # и @octagon/config именно через него. В job admin такая сборка была, в
        # job verify — нет, поэтому typecheck падал с «Cannot find module
        # @octagon/config». Локально dist уже лежал от предыдущих сборок,
        # поэтому расхождение было незаметно.
        run: pnpm build:packages

      - name: Install PostgreSQL client
        # ubuntu-latest может не содержать psql, а он нужен шагу ниже.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Prepare test database
        # Схема тестовой БД создается теми же миграциями, что и рабочая:
        # иначе e2e-тесты проверяли бы не то, что уедет в staging.
        #
        # `pnpm db:deploy:test` — корневой скрипт. Его не было в корневом
        # package.json (только в apps/api), поэтому шаг падал с «command not
        # found» и не давал запуститься линтеру и тестам. Локальный аналог CI
        # этого не показывал: там миграции применяются через
        # scripts/apply-migration.mjs, а не через этот скрипт.
        run: |
          set -euxo pipefail

          echo "psql: $(command -v psql)"

          PGPASSWORD=octagon psql -h localhost -U octagon -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE octagon_test OWNER octagon"

          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy:test

          echo "tables in test database:"
          PGPASSWORD=octagon psql -h localhost -U octagon -d octagon_test -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate OpenAPI contract
        # Контракт не должен отставать от реализованных маршрутов.
        run: pnpm openapi:validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 7

  admin:
    # Админка собирается отдельным job: Next не нужны БД и Redis, а отдельный
    # job быстрее показывает, что именно сломалось.
    name: admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts
        # Админка импортирует значения из @octagon/contracts, а пакет отдает
        # только dist: без этой сборки next build не найдет модуль.
        run: pnpm build:packages

      - name: Generate OpenAPI types
        # Типы админки выводятся из контракта: так расхождение с backend видно
        # на сборке, а не в рантайме (docs/09-api.md, contracts-first).
        # exec — потому что при hoisted-раскладке .bin есть только в корне.
        run: |
          pnpm --filter @octagon/admin exec openapi-typescript ../../openapi.yaml -o src/lib/api/schema.d.ts
          git diff --exit-code apps/admin/src/lib/api/schema.d.ts \
            || (echo "schema.d.ts устарел: выполните pnpm --filter @octagon/admin api:types" && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @octagon/admin exec tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @octagon/admin exec next build
