name: CI

# PR не должен мержиться при failed lint/test/build (docs/16-testing.md).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # Тестовый контур: значения не секреты, используются только в CI.
  DATABASE_URL: postgresql://octagon:octagon@localhost:5432/octagon?schema=public
  TEST_DATABASE_URL: postgresql://octagon:octagon@localhost:5432/octagon_test
  REDIS_URL: redis://localhost:6379
  TEST_REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-access-secret-value-at-least-32-characters
  JWT_REFRESH_SECRET: ci-refresh-secret-value-at-least-32-characters

jobs:
  verify:
    name: lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Версия совпадает с docker-compose.yml и docs/14-infrastructure.md.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octagon
          POSTGRES_PASSWORD: octagon
          POSTGRES_DB: octagon
          TZ: UTC
          # Та же collation, что в docker-compose.yml: иначе регистронезависимый
          # поиск по кириллице ведет себя по-разному на разных стендах.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=en-US'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U octagon -d octagon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Redis нужен для rate limiting auth-эндпоинтов (docs/15-security.md).
        # Локально допускается версия 5, в CI используется 7 как в compose.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        # --ignore-scripts: Prisma Client генерируется отдельным шагом в
        # apps/api/generated/prisma (см. docs/27-local-development.md).
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build packages
        # Пакеты отдают только собранный dist (`main` и `types` в package.json
        # указывают на dist), а typecheck и тесты API резолвят @octagon/contracts
        # и @octagon/config именно через него. В job admin такая сборка была, в
        # job verify — нет, поэтому typecheck падал с «Cannot find module
        # @octagon/config». Локально dist уже лежал от предыдущих сборок,
        # поэтому расхождение было незаметно.
        run: pnpm build:packages

      - name: Install PostgreSQL client
        # ubuntu-latest может не содержать psql, а он нужен шагу ниже.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Prepare test database
        # Схема тестовой БД создается теми же миграциями, что и рабочая:
        # иначе e2e-тесты проверяли бы не то, что уедет в staging.
        #
        # `pnpm db:deploy:test` — корневой скрипт. Его не было в корневом
        # package.json (только в apps/api), поэтому шаг падал с «command not
        # found» и не давал запуститься линтеру и тестам. Локальный аналог CI
        # этого не показывал: там миграции применяются через
        # scripts/apply-migration.mjs, а не через этот скрипт.
        run: |
          set -euxo pipefail

          echo "psql: $(command -v psql)"

          PGPASSWORD=octagon psql -h localhost -U octagon -d postgres \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE octagon_test OWNER octagon"

          DATABASE_URL="$TEST_DATABASE_URL" pnpm db:deploy:test

          echo "tables in test database:"
          PGPASSWORD=octagon psql -h localhost -U octagon -d octagon_test -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate OpenAPI contract
        # Контракт не должен отставать от реализованных маршрутов.
        run: pnpm openapi:validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage/**'
          if-no-files-found: ignore
          retention-days: 7

  admin:
    # Админка собирается отдельным job: Next не нужны БД и Redis, а отдельный
    # job быстрее показывает, что именно сломалось.
    name: admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build contracts
        # Админка импортирует значения из @octagon/contracts, а пакет отдает
        # только dist: без этой сборки next build не найдет модуль.
        run: pnpm build:packages

      - name: Generate OpenAPI types
        # Типы админки выводятся из контракта: так расхождение с backend видно
        # на сборке, а не в рантайме (docs/09-api.md, contracts-first).
        # exec — потому что при hoisted-раскладке .bin есть только в корне.
        run: |
          pnpm --filter @octagon/admin exec openapi-typescript ../../openapi.yaml -o src/lib/api/schema.d.ts
          git diff --exit-code apps/admin/src/lib/api/schema.d.ts \
            || (echo "schema.d.ts устарел: выполните pnpm --filter @octagon/admin api:types" && exit 1)

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter @octagon/admin exec tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @octagon/admin exec next build

  docker:
    # Образы проверяются сборкой и запуском, а не только наличием Dockerfile:
    # ошибка в путях COPY или отсутствующий модуль в standalone-сборке
    # обнаружились бы иначе лишь на сервере при выкате.
    name: docker (образы и конфиг nginx)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: octagon-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: false
          load: true
          tags: octagon-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          load: true
          tags: octagon-admin:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test admin image
        # Контейнер должен подняться и отдать страницу входа. Это проверяет, что
        # standalone-сборка содержит все нужные файлы и что сервер слушает
        # 0.0.0.0, а не только localhost.
        run: |
          set -euxo pipefail
          docker run -d --name admin-smoke -p 3000:3000 \
            -e API_BASE_URL=http://127.0.0.1:9/api/v1 octagon-admin:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "админка отвечает на /login"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "админка не ответила за 30 попыток"
              docker logs admin-smoke
              exit 1
            fi
            sleep 2
          done

      - name: Stop admin container
        if: always()
        run: docker rm -f admin-smoke || true

      - name: Check nginx config
        # `nginx -t` проверяет синтаксис и доступность сертификатов. Тестовые
        # сертификаты создаются здесь же: в репозитории их быть не должно.
        run: |
          set -euxo pipefail
          mkdir -p infra/nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=staging.test' \
            -keyout infra/nginx/certs/admin.key -out infra/nginx/certs/admin.crt
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=api.staging.test' \
            -keyout infra/nginx/certs/api.key -out infra/nginx/certs/api.crt

          docker run --rm \
            -e ADMIN_HOST=staging.test \
            -e API_HOST=api.staging.test \
            -e 'NGINX_ENVSUBST_FILTER=^(ADMIN_HOST|API_HOST)$' \
            -v "$PWD/infra/nginx/staging.conf.template:/etc/nginx/templates/staging.conf.template:ro" \
            -v "$PWD/infra/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

      - name: Check nginx config output
        # Отдельная проверка подстановки: если envsubst затронул переменные самого
        # nginx ($host, $request_uri), конфиг останется синтаксически валидным, но
        # работать не будет. Здесь проверяется, что подставились только домены.
        run: |
          set -euxo pipefail
          docker run --rm \
            -e ADMIN_HOST=staging.test \
            -e API_HOST=api.staging.test \
            -e 'NGINX_ENVSUBST_FILTER=^(ADMIN_HOST|API_HOST)$' \
            -v "$PWD/infra/nginx/staging.conf.template:/etc/nginx/templates/staging.conf.template:ro" \
            -v "$PWD/infra/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine sh -c '
              envsubst "$(printf "\${%s} " ADMIN_HOST API_HOST)" \
                < /etc/nginx/templates/staging.conf.template > /tmp/rendered.conf
              grep -q "server_name staging.test;" /tmp/rendered.conf
              grep -q "server_name api.staging.test;" /tmp/rendered.conf
              grep -q "\$host" /tmp/rendered.conf
              grep -q "\$request_uri" /tmp/rendered.conf
              echo "подстановка корректна: домены заменены, переменные nginx сохранены"
            '
