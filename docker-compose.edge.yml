# Edge-прокси: единственный публичный вход для production и staging.
#
#   docker compose --project-name octagon-edge -f docker-compose.edge.yml up -d
#
# Слушает 80/443 на хосте (network_mode: host), терминирует TLS и маршрутизирует
# по server_name:
#   admin/api.octagon-karate.online        → 127.0.0.1:8444 (production-nginx)
#   staging-admin/staging-api...online     → 127.0.0.1:8443 (staging-nginx)
#
# Внутренние nginx слушают только loopback и отдают HTTPS; сертификаты Let's
# Encrypt лежат в томе octagon-staging_letsencrypt (общий certbot).

name: octagon-edge

services:
  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - octagon-staging_letsencrypt:/etc/letsencrypt:ro

volumes:
  octagon-staging_letsencrypt:
    external: true
