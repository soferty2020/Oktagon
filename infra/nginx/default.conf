# Заглушка вместо /etc/nginx/conf.d/default.conf из образа nginx.
#
# Официальный образ кладет в conf.d/default.conf server-блок с `server_name _`,
# который слушает 80 и отдает «Welcome to nginx». Он подключается раньше нашего
# staging.conf (алфавитный порядок), поэтому:
#   - запрос на 80 получал 200 с заглушкой вместо редиректа на HTTPS;
#   - ACME-челлендж уходил в default и возвращал 404, то есть Let's Encrypt не
#     мог подтвердить домен.
#
# Файл монтируется в compose поверх default.conf. Пустой server не нужен: сам
# файл — комментарий, nginx его пропускает.
