# Единый внешний reverse proxy (edge) для production и staging на одном сервере.
#
# Задача: оба стека не могут слушать 80/443. Edge занимает 80/443, терминирует
# TLS для всех доменов и маршрутизирует по server_name во внутренние nginx.
#
# Почему проксирование на HTTPS внутреннего nginx, а не на HTTP:
# шаблон внутреннего nginx перенаправляет HTTP → HTTPS (301). Если edge пойдёт
# на его :80, клиент получит 301 на свой же HTTPS-адрес и попадёт в цикл.
# Запрос к внутреннему :443 уже защищён (самоподписанный сертификат), редиректа
# нет, а проверку этого сертификата edge отключает: трафик не покидает хост.
#
# Заголовки: Host сохраняется, X-Forwarded-Proto=https, реальный IP клиента —
# через real_ip из заголовка edge (внутренние nginx слушают только loopback).
#
# Установка:
#   1. Подставить домены: envsubst '${PROD_ADMIN_HOST} ${PROD_API_HOST}' \
#        < infra/nginx/edge.conf > /etc/nginx/sites-available/octagon-edge.conf
#   2. ln -s /etc/nginx/sites-available/octagon-edge.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# Порты контейнеров после включения edge (только loopback):
#   staging-nginx  127.0.0.1:8443:443
#   prod-nginx     127.0.0.1:8444:443

# --- ACME для всех доменов: HTTP-01 отвечает сам edge ---
server {
    listen 80;
    server_name admin.octagon-karate.online api.octagon-karate.online
                ${PROD_ADMIN_HOST} ${PROD_API_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Staging: HTTPS внутрь, без цикла ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.octagon-karate.online api.octagon-karate.online;

    ssl_certificate     /etc/letsencrypt/live/octagon/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- Production: HTTPS внутрь, без цикла ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${PROD_ADMIN_HOST} ${PROD_API_HOST};

    ssl_certificate     /etc/letsencrypt/live/octagon-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon-prod/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
