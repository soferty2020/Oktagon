# Единый внешний reverse proxy (edge) для production и staging на одном сервере.
#
# Зачем: оба стека не могут слушать 80/443 одновременно. Edge занимает 80/443,
# терминирует TLS для всех доменов и маршрутизирует по server_name во внутренние
# nginx-контейнеры (staging-nginx и prod-nginx), которые остаются в своих сетях.
#
# Установка (вне docker compose, на хосте):
#   cp infra/nginx/edge.conf /etc/nginx/sites-available/octagon-edge.conf
#   ln -s /etc/nginx/sites-available/octagon-edge.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Порты контейнеров после включения edge:
#   staging-nginx  127.0.0.1:8080   (только localhost)
#   prod-nginx     127.0.0.1:8081
# Порт 443 наружу публикует только edge.

# --- ACME для всех доменов сразу ---
server {
    listen 80;
    server_name admin.octagon-karate.online api.octagon-karate.online
                ${PROD_ADMIN_HOST} ${PROD_API_HOST};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Staging ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.octagon-karate.online api.octagon-karate.online;

    ssl_certificate     /etc/letsencrypt/live/octagon-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon-staging/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Production ---
server {
    listen 443 ssl;
    http2 on;
    server_name ${PROD_ADMIN_HOST} ${PROD_API_HOST};

    ssl_certificate     /etc/letsencrypt/live/octagon-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon-prod/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
