# Единый внешний reverse proxy (edge) для production и staging на одном сервере.
#
# Домены (утверждены владельцем):
#   production  admin.octagon-karate.online, api.octagon-karate.online
#   staging     staging-admin.octagon-karate.online, staging-api.octagon-karate.online
#
# Edge занимает 80/443 и маршрутизирует по server_name. Внутренние nginx
# слушают только loopback и по HTTPS — так нет цикла HTTP → HTTPS (внутренний
# nginx редиректит на HTTPS, поэтому edge ходит сразу на его :443).
#
# Установка:
#   cp infra/nginx/edge.conf /etc/nginx/sites-available/octagon-edge.conf
#   ln -s /etc/nginx/sites-available/octagon-edge.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Порты контейнеров при работе за edge (только loopback):
#   staging-nginx  127.0.0.1:8443:443
#   prod-nginx     127.0.0.1:8444:443
#
# Сертификаты: /etc/letsencrypt/live/<cert-name>/{fullchain,privkey}.pem
#   production — octagon-prod
#   staging    — octagon-staging

# --- ACME для всех четырёх доменов: HTTP-01 отвечает сам edge ---
server {
    listen 80;
    server_name admin.octagon-karate.online api.octagon-karate.online
                staging-admin.octagon-karate.online staging-api.octagon-karate.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Production ---
server {
    listen 443 ssl;
    http2 on;
    server_name admin.octagon-karate.online api.octagon-karate.online;

    ssl_certificate     /etc/letsencrypt/live/octagon-prod/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon-prod/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://127.0.0.1:8444;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- Staging ---
server {
    listen 443 ssl;
    http2 on;
    server_name staging-admin.octagon-karate.online staging-api.octagon-karate.online;

    ssl_certificate     /etc/letsencrypt/live/octagon/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/octagon/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
