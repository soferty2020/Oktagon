            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Группа (`GROUP_NOT_FOUND`) или спортсмен (`ATHLETE_NOT_FOUND`) не
            найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Спортсмен уже в этой группе (`ATHLETE_ALREADY_MEMBER`) или у него
            есть другая активная группа (`ACTIVE_MEMBERSHIP_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /groups/{id}/members/{athleteId}:
    delete:
      tags: [groups]
      summary: Завершить членство спортсмена
      description: |
        Запись не удаляется: проставляются `state = ENDED` и `leftAt`, поэтому
        история членства сохраняется. После этого спортсмена можно зачислить в
        другую группу.
      operationId: endGroupMembership
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Группа с обновленным составом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Активного членства нет (`MEMBERSHIP_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из ответа `/auth/login` или `/auth/refresh`

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid

    BranchId:
      name: id
      in: path
      required: true
      description: Идентификатор филиала
      schema:
        type: string
        format: uuid

    TrainerId:
      name: id
      in: path
      required: true
      description: Идентификатор профиля тренера
      schema:
        type: string
        format: uuid

    AthleteId:
      name: id
      in: path
      required: true
      description: Идентификатор спортсмена
      schema:
        type: string
        format: uuid

    GroupId:
      name: id
      in: path
      required: true
      description: Идентификатор группы
      schema:
        type: string
        format: uuid

  responses:
    ValidationFailed:
      description: Ошибка валидации входных данных (`VALIDATION_FAILED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: |
        Требуется access-токен или он недействителен (`UNAUTHENTICATED`).
        В заголовке `WWW-Authenticate` клиент получает требование Bearer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ресурс не найден (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Превышен лимит запросов (`RATE_LIMITED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Зависимость недоступна (`SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      description: Единый формат ошибки (`docs/09-api.md`)
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный машиночитаемый код
          example: SCHEDULE_CONFLICT
        message:
          type: string
          description: Текст для человека
          example: Занятие пересекается с другим в этом зале
        details:
          type: object
          additionalProperties: true
          description: Дополнительные сведения; состав зависит от кода
          example:
            missingPermissions: [payments.edit]
        requestId:
          type: string
          description: Идентификатор запроса для сопоставления с логами
          example: 6f1c2f0a-6f2e-4f4a-9d0e-3f1b2c3d4e5f

    ErrorCode:
      type: string
      description: |
        Реализованные коды ошибок. Список полный для текущих эндпоинтов;
        он расширяется по мере реализации модулей.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
        - EMAIL_ALREADY_EXISTS
        - INVITE_INVALID
        - INVITE_EXPIRED
        - INVITE_ALREADY_USED
        - INVITE_EMAIL_MISMATCH
        - USER_BLOCKED
        - PERMISSION_UNKNOWN
        - PERMISSION_GRANTED_BY_ROLE
        - PERMISSION_IS_ROLE_BASED
        - PERMISSION_NOT_GRANTED
        - PERMISSION_EXPIRES_IN_PAST
        - BRANCH_NOT_FOUND
        - BRANCH_ARCHIVED
        - HALL_NOT_FOUND
        - HALL_NOT_IN_BRANCH
        - TRAINER_NOT_FOUND
        - TRAINER_ALREADY_ASSIGNED
        - ATHLETE_NOT_FOUND
        - ATHLETE_ARCHIVED
        - ACCOUNT_ALREADY_LINKED
        - ACCOUNT_NOT_LINKED
        - ACTIVE_MEMBERSHIP_EXISTS
        - GROUP_NOT_FOUND
        - GROUP_ARCHIVED
        - GROUP_TRAINER_ALREADY_ASSIGNED
        - GROUP_TRAINER_NOT_ASSIGNED
        - GROUP_BRANCH_ALREADY_LINKED
        - GROUP_BRANCH_NOT_LINKED
        - ATHLETE_ALREADY_MEMBER
        - MEMBERSHIP_NOT_FOUND

    PermissionCode:
      type: string
      description: Право из каталога (`docs/04-roles-permissions.md`)
      enum:
        - athletes.view
        - athletes.edit
        - athletes.contacts.view
        - groups.view
        - groups.edit
        - attendance.view
        - attendance.edit
        - schedule.view
        - schedule.edit
        - schedule.cancel
        - schedule.change_trainer
        - schedule.change_location
        - payments.view
        - payments.edit
        - freezes.view
        - freezes.edit
        - news.create
        - news.edit
        - news.delete
        - news.moderate
        - chat.use
        - branches.view
        - branches.manage
        - users.manage
        - permissions.manage
        - analytics.view

    UserRole:
      type: string
      description: Базовая роль (`docs/04-roles-permissions.md`)
      enum: [MEMBER, STAFF, SUPERADMIN]

    UserStatus:
      type: string
      enum: [INVITED, ACTIVE, BLOCKED]

    AthleteStatus:
      type: string
      description: Статус карточки спортсмена (BR-006)
      enum: [ACTIVE, FROZEN, ARCHIVED]

    Gender:
      type: string
      enum: [MALE, FEMALE, UNSPECIFIED]

    LivenessReport:
      type: object
      required: [status, service, environment, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: octagon-api
        environment:
          type: string
          enum: [local, test, staging, production]
        version:
          type: string
          example: 0.0.0
        uptimeSeconds:
          type: integer
          example: 185
        clubTimezone:
          type: string
          description: Локальная timezone клуба из конфигурации
          example: Asia/Almaty
        timestamp:
          type: string
          format: date-time

    ReadinessReport:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                example: database
              status:
                type: string
                enum: [up, down]
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 10

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Не задан — выход не меняет состояние

    AuthTokens:
      type: object
      required: [accessToken, expiresIn, refreshToken, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          description: Короткоживущий access-токен (JWT)
        expiresIn:
          type: integer
          description: Время жизни access-токена в секундах
          example: 900
        refreshToken:
          type: string
          description: Refresh-токен; в БД хранится только его хеш
        refreshExpiresAt:
          type: string
          format: date-time

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'

    UserPermissionGrant:
      type: object
      required: [code, description, isFinancial, grantedAt]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        description:
          type: string
          example: Просмотр оплат
        isFinancial:
          type: boolean
          description: Финансовое право — особо защищенное (BR-010)
        grantedAt:
          type: string
          format: date-time
        grantedById:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Не задан — выдача бессрочная

    UserPermissions:
      type: object
      required: [codes, grants]
      properties:
        codes:
          type: array
          description: Итоговый набор прав (роль плюс действующие выдачи)
          items:
            $ref: '#/components/schemas/PermissionCode'
        grants:
          type: array
          description: Только выданные лично права
          items:
            type: object
            required: [code, grantedAt]
            properties:
              code:
                $ref: '#/components/schemas/PermissionCode'
              grantedAt:
                type: string
                format: date-time

    UserProfile:
      type: object
      description: 'Профиль из `GET /me` (ADR-0007). Секреты и внутренние поля не отдаются.'
      required: [id, email, firstName, lastName, role, status, scopeAllGroups, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        scopeAllGroups:
          type: boolean
          description: |
            true — сотрудник видит все группы, а не только свои (ADR-0006).
        permissions:
          $ref: '#/components/schemas/UserPermissions'

    LinkedAthlete:
      type: object
      required: [id, firstName, lastName, status, relation, isPrimary]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
          description: Календарная дата без времени
        status:
          $ref: '#/components/schemas/AthleteStatus'
        relation:
          type: string
          description: Тип связи аккаунта со спортсменом
          example: PARENT
        isPrimary:
          type: boolean

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/UserRole'

    UserInviteView:
      type: object
      description: Приглашение без токена и его хеша
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserInviteCreated:
      allOf:
        - $ref: '#/components/schemas/UserInviteView'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Токен приглашения. Возвращается только при создании; в БД
                хранится его SHA-256-хеш. Передается пользователю вручную.
              example: 9f8c1d2e3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5

    AcceptInviteRequest:
      type: object
      required: [email, password, firstName, lastName]
      description: Нужно указать ровно одно из `token` или `inviteId`
      properties:
        token:
          type: string
          minLength: 16
          description: Токен приглашения из ответа на создание
        inviteId:
          type: string
          format: uuid
          description: Идентификатор приглашения (альтернатива токену)
        email:
          type: string
          format: email
          maxLength: 254
          description: Должен совпадать с адресом приглашения
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32

    InviteAcceptance:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    GrantPermissionRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Не задан — выдача бессрочная; срок в прошлом отклоняется

    UserPermissionsView:
      type: object
      description: |
        Права раздельно: базовый набор роли, индивидуальные выдачи и итог.
        Разделение нужно админке, чтобы показать, что выдано вручную.
      required: [userId, role, scopeAllGroups, rolePermissions, grants, effective]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        scopeAllGroups:
          type: boolean
        rolePermissions:
          type: array
          description: Права, которые дает роль
          items:
            $ref: '#/components/schemas/PermissionCode'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/UserPermissionGrant'
        effective:
          type: array
          description: Итоговый действующий набор прав
          items:
            $ref: '#/components/schemas/PermissionCode'

    BranchView:
      type: object
      required: [id, name, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BranchDetails:
      allOf:
        - $ref: '#/components/schemas/BranchView'
        - type: object
          required: [halls]
          properties:
            halls:
              type: array
              items:
                $ref: '#/components/schemas/HallView'

    HallView:
      type: object
      required: [id, branchId, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          nullable: true
        isActive:
          type: boolean

    TrainerView:
      type: object
      description: |
        Профиль тренера. `userId` может быть null: часть тренеров работает без
        входа в систему (docs/04-roles-permissions.md).
      required: [id, displayName, isActive]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        isActive:
          type: boolean

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 32

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 32
        isActive:
          type: boolean

    CreateHallRequest:
      type: object
      required: [branchId, name]
      properties:
        branchId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 1000

    UpdateHallRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        isActive:
          type: boolean

    CreateTrainerRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        bio:
          type: string
          maxLength: 2000
        userId:
          type: string
          format: uuid
          description: Не обязателен; у аккаунта не должно быть другого профиля тренера

    UpdateTrainerRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        bio:
          type: string
          maxLength: 2000
        isActive:
          type: boolean

    AthleteView:
      type: object
      description: |
        Карточка спортсмена. `phone` и `email` равны null, если у вызывающего
        нет права `athletes.contacts.view`.
      required: [id, firstName, lastName, gender, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        status:
          $ref: '#/components/schemas/AthleteStatus'
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AthleteDetails:
      allOf:
        - $ref: '#/components/schemas/AthleteView'
        - type: object
          properties:
            notes:
              type: string
              nullable: true
              description: Заметки клуба; в `/me/athletes` не отдаются
            linkedAccounts:
              type: array
              items:
                type: object
                required: [userId, email, relation, isPrimary]
                properties:
                  userId:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  relation:
                    type: string
                    example: PARENT
                  isPrimary:
                    type: boolean

    CreateAthleteRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date
          example: '2015-09-01'
        gender:
          $ref: '#/components/schemas/Gender'
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 2000

    UpdateAthleteRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/AthleteStatus'

    LinkAccountRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        relation:
          type: string
          maxLength: 32
          example: PARENT
          description: PARENT, GUARDIAN, SELF
        isPrimary:
          type: boolean
          description: Основной аккаунт спортсмена; он может быть один

    GroupView:
      type: object
      required: [id, name, isActive, activeMembersCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        primaryBranchName:
          type: string
          nullable: true
          description: Основной филиал, если он назначен
        activeMembersCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupDetails:
      allOf:
        - $ref: '#/components/schemas/GroupView'
        - type: object
          required: [branches, trainers, members]
          properties:
            branches:
              type: array
              items:
                $ref: '#/components/schemas/GroupBranchView'
            trainers:
              type: array
              items:
                $ref: '#/components/schemas/GroupTrainerView'
            members:
              type: array
              items:
                $ref: '#/components/schemas/GroupMemberView'

    GroupBranchView:
      type: object
      required: [branchId, branchName, isPrimary]
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        isPrimary:
          type: boolean

    GroupTrainerView:
      type: object
      required: [trainerId, displayName, isPrimary, assignedAt]
      properties:
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера
        displayName:
          type: string
        isPrimary:
          type: boolean
        assignedAt:
          type: string
          format: date-time

    GroupMemberView:
      type: object
      required: [athleteId, firstName, lastName, status, joinedAt]
      properties:
        athleteId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: '#/components/schemas/AthleteStatus'
        joinedAt:
          type: string
          format: date

    ActiveMembershipView:
      type: object
      nullable: true
      required: [membershipId, groupId, groupName, joinedAt]
      properties:
        membershipId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        joinedAt:
          type: string
          format: date

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        isActive:
          type: boolean

    LinkGroupBranchRequest:
      type: object
      required: [branchId]
      properties:
        branchId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
          description: Основной филиал группы; он может быть один

    AssignGroupTrainerRequest:
      type: object
      required: [trainerId]
      properties:
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера, а не аккаунта
        isPrimary:
          type: boolean
          description: Основной тренер группы; он может быть один

    AddGroupMemberRequest:
      type: object
      required: [athleteId]
      properties:
        athleteId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date
          description: Дата вступления; по умолчанию сегодня

security:
  - bearerAuth: []
