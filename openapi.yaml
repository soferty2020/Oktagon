openapi: 3.0.3
info:
  title: OCTAGON Club API
  version: 0.1.0
  description: |
    Контракт backend API клуба карате OCTAGON.

    Источник истины: `docs/09-api.md` (стиль и формат ошибок),
    `docs/23-api-contract-plan.md` (правила контракта), `docs/04-roles-permissions.md`
    (permissions), ADR-0006 (модель прав), ADR-0007 (форма профиля).

    Правила контракта:
    - идентификаторы — UUID;
    - timestamps — ISO-8601 в UTC;
    - ошибки — единый формат `{ code, message, details?, requestId? }`
      с машиночитаемым `code`;
    - 401 означает «не аутентифицирован», 403 — «аутентифицирован, но нет прав»;
    - финансовые поля не отдаются без права `payments.*` / `freezes.*` (BR-010).

    Реализованные разделы: health, auth, identity, invites, permissions.
    Остальные разделы (athletes, groups, schedule, attendance, finance, news,
    chat, analytics) появятся по мере реализации эпиков из `docs/18-roadmap.md`.
servers:
  - url: /api/v1
    description: Текущий префикс API
tags:
  - name: health
    description: Проверки живости и готовности
  - name: auth
    description: Вход, обновление сессии, выход, принятие приглашения
  - name: identity
    description: Текущий пользователь и связанные спортсмены
  - name: users
    description: Пользователи, приглашения и индивидуальные права

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Сообщает, что процесс API жив. Зависимости не проверяются.
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Процесс API жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessReport'

  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: |
        Проверяет зависимости: PostgreSQL всегда, Redis — если задан `REDIS_URL`.
        Возвращает 503, если хотя бы одна зависимость недоступна.
      security: []
      operationId: getHealthReady
      responses:
        '200':
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessReport'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/login:
    post:
      tags: [auth]
      summary: Вход по email и паролю
      description: |
        Возвращает access- и refresh-токены, а также профиль с эффективными
        правами, чтобы клиенту не требовался отдельный запрос за правами.

        Частота попыток ограничена отдельно по IP и по email
        (`docs/15-security.md`). Неизвестный email и неверный пароль дают
        одинаковый ответ, чтобы не раскрывать существование аккаунта.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: |
            Неверный email или пароль (`INVALID_CREDENTIALS`), приглашение не
            принято (`INVITE_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Учетная запись заблокирована (`USER_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновление сессии с ротацией refresh-токена
      description: |
        Старый refresh-токен отзывается, выдается новая пара. Повторное
        использование отозванного токена трактуется как компрометация: все
        токены пользователя отзываются, следующее обновление также вернет 401.
      security: []
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов и профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: |
            Refresh-токен недействителен, истек, отозван или уже использован
            (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Учетная запись заблокирована (`USER_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/logout:
    post:
      tags: [auth]
      summary: Выход из системы
      description: Отзывает переданный refresh-токен. Без токена также отвечает 204.
      security: []
      operationId: logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Токен отозван (или отзывать было нечего)

  /auth/accept-invite:
    post:
      tags: [auth]
      summary: Принятие приглашения
      description: |
        Пользователь задает пароль и профиль. Доступен без аутентификации:
        приглашенный еще не имеет пароля.

        Проверяются срок действия токена, признак использования и совпадение
        email с приглашением. Пароль хешируется Argon2id (ADR-0004). Попытки
        подбора токена ограничены по IP.
      security: []
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: Пользователь активирован; далее выполняется вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteAcceptance'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`), приглашение не найдено
            (`INVITE_INVALID`) или срок истек (`INVITE_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Приглашение выдано на другой email (`INVITE_EMAIL_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Приглашение уже использовано (`INVITE_ALREADY_USED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /me:
    get:
      tags: [identity]
      summary: Профиль текущего пользователя
      description: |
        Идентификация, роль, статус и эффективные права. Связанных спортсменов
        здесь нет: их список растет, поэтому он вынесен в `/me/athletes`
        (ADR-0007).
      operationId: getMe
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Учетная запись заблокирована (`USER_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/athletes:
    get:
      tags: [identity]
      summary: Спортсмены, связанные с аккаунтом
      description: |
        Данные для переключателя спортсменов: по `docs/00-project-overview.md`
        аккаунт не равен карточке спортсмена. Заметки клуба (`notes`) не
        отдаются.
      operationId: getMyAthletes
      responses:
        '200':
          description: Список связанных спортсменов (может быть пустым)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedAthlete'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users/invites:
    get:
      tags: [users]
      summary: Действующие приглашения
      description: Непринятые и неистекшие приглашения. Токен и его хеш не отдаются.
      operationId: listInvites
      parameters:
        - name: email
          in: query
          required: false
          description: Фильтр по адресу
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Список приглашений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserInviteView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `users.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [users]
      summary: Пригласить пользователя
      description: |
        Саморегистрации в MVP нет (`docs/01-mvp-scope.md`): пользователя
        приглашает администратор.

        Провайдер доставки письма еще не выбран (`docs/25-open-questions.md`),
        поэтому `token` возвращается только здесь и передается вручную.
        Повторное приглашение на тот же адрес гасит предыдущие непринятые.
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Приглашение создано; `token` показывается только в этом ответе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInviteCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `users.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Пользователь с таким email уже существует (`EMAIL_ALREADY_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{userId}/permissions:
    get:
      tags: [users]
      summary: Права пользователя
      description: |
        Возвращает права раздельно: базовый набор роли, индивидуальные выдачи и
        итоговый набор. Нужно для экрана управления правами в админке
        (ADR-0006).
      operationId: listUserPermissions
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Состояние прав пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissionsView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `permissions.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [users]
      summary: Выдать индивидуальное право
      description: |
        Выдача только добавляет право поверх роли. Право, которое уже
        обеспечивает роль, выдать нельзя: это не изменило бы доступ, но
        создало бы иллюзию управляемой выдачи.

        Изменение попадает в audit log (BR-007).
      operationId: grantUserPermission
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPermissionRequest'
      responses:
        '201':
          description: Право выдано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermissionGrant'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`), неизвестный код права
            (`PERMISSION_UNKNOWN`) или срок в прошлом (`PERMISSION_EXPIRES_IN_PAST`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `permissions.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Право уже предоставлено ролью (`PERMISSION_GRANTED_BY_ROLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{userId}/permissions/{code}:
    delete:
      tags: [users]
      summary: Отозвать индивидуальное право
      description: |
        Отзывает только индивидуальную выдачу. Право, пришедшее от роли,
        отозвать нельзя (`PERMISSION_IS_ROLE_BASED`): роль должна оставаться
        предсказуемой.

        Изменение попадает в audit log (BR-007).
      operationId: revokeUserPermission
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: code
          in: path
          required: true
          description: Код права из каталога
          schema:
            $ref: '#/components/schemas/PermissionCode'
      responses:
        '204':
          description: Право отозвано
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `permissions.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Пользователь не найден (`NOT_FOUND`) или право не выдавалось
            (`PERMISSION_NOT_GRANTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Право предоставлено ролью (`PERMISSION_IS_ROLE_BASED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /branches:
    get:
      tags: [branches]
      summary: Список филиалов
      operationId: listBranches
      parameters:
        - name: isActive
          in: query
          required: false
          description: Фильтр по активности
          schema:
            type: boolean
      responses:
        '200':
          description: Филиалы клуба
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BranchView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [branches]
      summary: Создать филиал
      description: Изменение структуры клуба попадает в audit log (BR-007).
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Филиал создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /branches/{id}:
    get:
      tags: [branches]
      summary: Филиал с залами
      operationId: getBranch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Филиал и его залы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Филиал не найден (`BRANCH_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [branches]
      summary: Изменить филиал
      description: |
        Частичное обновление. `isActive: false` временно закрывает филиал,
        не удаляя его.
      operationId: updateBranch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Филиал обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Филиал не найден (`BRANCH_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [branches]
      summary: Архивировать филиал
      description: |
        Мягкое удаление (`archivedAt`): филиал исчезает из справочников, но
        история сохраняется (docs/08-database.md).
      operationId: archiveBranch
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '204':
          description: Филиал архивирован
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Филиал не найден (`BRANCH_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /branches/{id}/halls:
    get:
      tags: [halls]
      summary: Залы филиала
      operationId: listBranchHalls
      parameters:
        - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Список залов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HallView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Филиал не найден (`BRANCH_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [halls]
      summary: Создать зал в филиале
      description: В неактивном филиале зал создать нельзя (`BRANCH_ARCHIVED`).
      operationId: createBranchHall
      parameters:
        - $ref: '#/components/parameters/BranchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHallRequest'
      responses:
        '201':
          description: Зал создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или неактивный филиал
            (`BRANCH_ARCHIVED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Филиал не найден (`BRANCH_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /halls/{id}:
    patch:
      tags: [halls]
      summary: Изменить зал
      operationId: updateHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHallRequest'
      responses:
        '200':
          description: Зал обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Зал не найден (`HALL_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [halls]
      summary: Архивировать зал
      operationId: archiveHall
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Зал архивирован
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `branches.manage` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Зал не найден (`HALL_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /trainers:
    get:
      tags: [trainers]
      summary: Список тренеров
      operationId: listTrainers
      parameters:
        - name: isActive
          in: query
          required: false
