      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignGroupTrainerRequest'
      responses:
        '200':
          description: Группа с обновленными тренерами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Группа (`GROUP_NOT_FOUND`) или тренер (`TRAINER_NOT_FOUND`) не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Тренер уже ведет эту группу (`GROUP_TRAINER_ALREADY_ASSIGNED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /groups/{id}/trainers/{trainerId}:
    delete:
      tags: [groups]
      summary: Снять тренера с группы
      operationId: unassignGroupTrainer
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: trainerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Группа с обновленными тренерами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Назначения нет (`GROUP_TRAINER_NOT_ASSIGNED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /groups/{id}/members:
    post:
      tags: [groups]
      summary: Добавить спортсмена в группу
      description: |
        У спортсмена допускается одна активная группа (docs/08-database.md).
        Если он уже зачислен, возвращается `ACTIVE_MEMBERSHIP_EXISTS` с
        указанием текущей группы: сначала нужно завершить текущее членство.
      operationId: addGroupMember
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupMemberRequest'
      responses:
        '200':
          description: Группа с обновленным составом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или неактивная группа
            (`GROUP_ARCHIVED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Группа (`GROUP_NOT_FOUND`) или спортсмен (`ATHLETE_NOT_FOUND`) не
            найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Спортсмен уже в этой группе (`ATHLETE_ALREADY_MEMBER`) или у него
            есть другая активная группа (`ACTIVE_MEMBERSHIP_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /groups/{id}/members/{athleteId}:
    delete:
      tags: [groups]
      summary: Завершить членство спортсмена
      description: |
        Запись не удаляется: проставляются `state = ENDED` и `leftAt`, поэтому
        история членства сохраняется. После этого спортсмена можно зачислить в
        другую группу.
      operationId: endGroupMembership
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Группа с обновленным составом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `groups.edit` или группа вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Активного членства нет (`MEMBERSHIP_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'



  /schedule-templates:
    get:
      tags: [schedule]
      summary: Шаблоны расписания в зоне видимости вызывающего
      description: |
        Список ограничен ресурсным scope: тренер видит расписание только своих
        групп (docs/21-permission-matrix.md).
      operationId: listScheduleTemplates
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: year
          in: query
          required: false
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
      responses:
        '200':
          description: Шаблоны со слотами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleTemplateView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [schedule]
      summary: Создать шаблон расписания на квартал
      description: |
        Границы квартала вычисляются календарно. Повторный шаблон на тот же
        квартал отклоняется (`SCHEDULE_TEMPLATE_EXISTS`): расписание группы на
        квартал одно.
      operationId: createScheduleTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleTemplateRequest'
      responses:
        '201':
          description: Шаблон создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Группа не найдена (`GROUP_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Шаблон на этот квартал уже есть (`SCHEDULE_TEMPLATE_EXISTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /schedule-templates/{id}:
    get:
      tags: [schedule]
      summary: Шаблон расписания
      operationId: getScheduleTemplate
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
      responses:
        '200':
          description: Шаблон со слотами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.view` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Шаблон не найден (`SCHEDULE_TEMPLATE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [schedule]
      summary: Удалить неопубликованный шаблон
      description: |
        Опубликованное расписание удалить нельзя (`SCHEDULE_TEMPLATE_PUBLISHED`):
        занятия уже созданы и показаны родителям, изменения вносятся точечно.
      operationId: deleteScheduleTemplate
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
      responses:
        '204':
          description: Шаблон удален
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Шаблон не найден (`SCHEDULE_TEMPLATE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Шаблон опубликован (`SCHEDULE_TEMPLATE_PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /schedule-templates/{id}/publish:
    post:
      tags: [schedule]
      summary: Опубликовать расписание
      description: |
        Публикация фиксирует шаблон: после нее слоты не меняются. Пустое
        расписание опубликовать нельзя (`SCHEDULE_TEMPLATE_EMPTY`).
      operationId: publishScheduleTemplate
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
      responses:
        '200':
          description: Шаблон опубликован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Шаблон не найден (`SCHEDULE_TEMPLATE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Расписание пустое (`SCHEDULE_TEMPLATE_EMPTY`) или уже опубликовано
            (`SCHEDULE_TEMPLATE_ALREADY_PUBLISHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /schedule-templates/{id}/generate:
    post:
      tags: [schedule]
      summary: Материализовать занятия квартала из шаблона
      description: |
        Создает экземпляры занятий на будущие даты квартала. Повторный вызов
        дублей не создает: уникальность `(groupId, startsAt)` и `skipDuplicates`.

        При `regenerate` удаляются только занятия, которые еще не начались:
        прошедшее занятие — факт истории, его пересоздание стерло бы
        посещаемость.

        Если тренер или зал заняты в это время в другой группе, генерация
        отклоняется с перечнем конфликтов: иначе о накладке узнали бы родители.
      operationId: generateTrainingSessions
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSessionsRequest'
      responses:
        '200':
          description: Сколько занятий создано, пропущено и удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateSessionsResult'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Шаблон не найден (`SCHEDULE_TEMPLATE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Расписание не опубликовано или пусто (`SCHEDULE_TEMPLATE_EMPTY`),
            либо есть конфликты (`TRAINING_SESSION_CONFLICT`). В `details`
            перечислены конфликтующие даты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /schedule-templates/{id}/slots:
    post:
      tags: [schedule]
      summary: Добавить слот в шаблон
      description: |
        Слот задает регулярность: день недели и локальное время клуба. Слоты
        внутри одного шаблона не должны пересекаться по времени
        (`SCHEDULE_SLOT_OVERLAPS`).

        В опубликованный шаблон слот добавить нельзя
        (`SCHEDULE_TEMPLATE_PUBLISHED`).
      operationId: addScheduleSlot
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddScheduleSlotRequest'
      responses:
        '200':
          description: Шаблон с обновленными слотами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или некорректный интервал
            (`SCHEDULE_SLOT_INVALID_TIME`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Шаблон не найден (`SCHEDULE_TEMPLATE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Слот пересекается с другим (`SCHEDULE_SLOT_OVERLAPS`) или шаблон
            опубликован (`SCHEDULE_TEMPLATE_PUBLISHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /schedule-templates/{id}/slots/{slotId}:
    patch:
      tags: [schedule]
      summary: Изменить слот
      description: Доступно только до публикации шаблона.
      operationId: updateScheduleSlot
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleSlotRequest'
      responses:
        '200':
          description: Шаблон с обновленными слотами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Слот не найден (`SCHEDULE_SLOT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Слот пересекается с другим (`SCHEDULE_SLOT_OVERLAPS`) или шаблон
            опубликован (`SCHEDULE_TEMPLATE_PUBLISHED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [schedule]
      summary: Удалить слот
      description: Доступно только до публикации шаблона.
      operationId: deleteScheduleSlot
      parameters:
        - $ref: '#/components/parameters/ScheduleTemplateId'
        - name: slotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Шаблон с обновленными слотами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTemplateView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Слот не найден (`SCHEDULE_SLOT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Шаблон опубликован (`SCHEDULE_TEMPLATE_PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions:
    get:
      tags: [schedule]
      summary: Занятия за период
      description: |
        По умолчанию отдается неделя назад и месяц вперед. Период задается
        `from` и `to`; список ограничен ресурсным scope.
      operationId: listTrainingSessions
      parameters:
        - name: from
          in: query
          required: false
          description: Начало периода, ISO-8601; включительно
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Конец периода, ISO-8601; исключительно
          schema:
            type: string
            format: date-time
        - name: groupId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: trainerId
          in: query
          required: false
          description: Идентификатор профиля тренера
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TrainingSessionStatus'
      responses:
        '200':
          description: Список занятий по возрастанию времени
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingSessionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [schedule]
      summary: Добавить занятие вручную
      description: |
        Два сценария: занести занятие задним числом (клуб начал работать раньше,
        чем появилась система) и добавить разовое занятие вне квартального
        расписания.

        Время задается локальным временем клуба, а не UTC. Занятие не связано с
        шаблоном (`fromTemplate` = false), поэтому пересоздание расписания его не
        затрагивает.

        Накладка проверяется только для занятия в будущем: в прошлом расписание
        часто велось иначе, и запрет мешал бы занести историю.
      operationId: createTrainingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Занятие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или некорректные дата и время
            (`SCHEDULE_SLOT_INVALID_TIME`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Группа не найдена (`GROUP_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Накладка в будущем (`TRAINING_SESSION_CONFLICT`) или занятие этой
            группы на это время уже есть (`TRAINING_SESSION_DUPLICATE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}:
    get:
      tags: [schedule]
      summary: Карточка занятия
      operationId: getTrainingSession
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Занятие
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.view` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/move:
    patch:
      tags: [schedule]
      summary: Перенести занятие
      description: |
        BR-009: меняется только экземпляр, квартальный шаблон остается прежним.
        Причина обязательна: родитель должен понимать, почему занятие переехало.

        Прошедшее занятие перенести нельзя (`SESSION_ALREADY_STARTED`).
      operationId: moveTrainingSession
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveSessionRequest'
      responses:
        '200':
          description: Занятие перенесено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или окончание раньше начала
            (`SCHEDULE_SLOT_INVALID_TIME`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Тренер занят (`TRAINER_BUSY`), зал занят (`HALL_BUSY`), у группы уже
            есть занятие (`TRAINING_SESSION_CONFLICT`) или занятие началось
            (`SESSION_ALREADY_STARTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/cancel:
    post:
      tags: [schedule]
      summary: Отменить занятие
      description: |
        Занятие не удаляется: проставляются статус `CANCELLED`, причина, время и
        автор отмены. Шаблон не меняется.
      operationId: cancelTrainingSession
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSessionRequest'
      responses:
        '200':
          description: Занятие отменено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `schedule.cancel` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Занятие уже отменено (`TRAINING_SESSION_CANCELLED`) или началось
            (`SESSION_ALREADY_STARTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/attendance:
    get:
      tags: [attendance]
      summary: Журнал занятия
      description: |
        Список строится по составу группы **на дату занятия**: спортсмен,
        зачисленный позже, не числится отсутствующим на занятии, которого не было
        в его расписании, а выбывший не получает отметок после ухода.

        Для каждого спортсмена отдается подтвержденная отметка и предупреждение
        родителя о планируемом отсутствии (BR-008).
      operationId: getSessionAttendance
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Состав группы на дату занятия со статусами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendanceView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `attendance.view` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [attendance]
      summary: Отметить посещаемость
      description: |
        Передаются только измененные спортсмены: тренер отмечает по ходу занятия,
        а не заполняет весь список сразу. Повторная отметка обновляет статус, а не
        создает вторую запись.

        Отметить можно только тех, кто числился в группе на дату занятия.
      operationId: saveAttendance
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAttendanceRequest'
      responses:
        '200':
          description: Журнал занятия после сохранения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendanceView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `attendance.edit` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Спортсмен не числился в группе (`ATHLETE_NOT_IN_GROUP`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/attendance/{athleteId}:
    delete:
      tags: [attendance]
      summary: Снять отметку спортсмена
      description: |
        Нужно, когда спортсмена отметили по ошибке: удалить запись честнее, чем
        оставить неверный статус.
      operationId: resetAttendance
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Журнал занятия после снятия отметки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendanceView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `attendance.edit` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Отметка не найдена (`ATTENDANCE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/attendance/planned-absence:
    post:
      tags: [attendance]
      summary: Сообщить о планируемом отсутствии
      description: |
        BR-008: родитель предупреждает заранее, но это предварительная
        информация — итоговую посещаемость подтверждает тренер. Предупреждение
        не создает отметку посещаемости.

        Родитель может сообщать только о связанных спортсменах, сотрудник — о тех,
        кто в его зоне видимости.
      operationId: reportPlannedAbsence
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPlannedAbsenceRequest'
      responses:
        '200':
          description: Предупреждение сохранено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendanceView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `attendance.view` или спортсмен вне зоны доступа
            (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Занятие не найдено (`TRAINING_SESSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Спортсмен не числился в группе (`ATHLETE_NOT_IN_GROUP`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /training-sessions/{id}/attendance/planned-absence/{athleteId}:
    delete:
      tags: [attendance]
      summary: Отменить предупреждение об отсутствии
      description: 'Спортсмен придет: предупреждение снимается до отметки тренера.'
      operationId: cancelPlannedAbsence
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
        - name: athleteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Предупреждение снято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendanceView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `attendance.view` или спортсмен вне зоны доступа
            (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Предупреждения нет (`PLANNED_ABSENCE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /attendance/summary:
    get:
      tags: [attendance]
      summary: Сводка посещаемости группы за период
      description: |
        Знаменатель — занятия, на которых спортсмен числился в составе: иначе
        процент посещаемости был бы занижен у тех, кто зачислен позже остальных.
      operationId: getAttendanceSummary
      parameters:
        - name: groupId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Начало периода, ISO-8601; по умолчанию 30 дней назад
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Посещения и пропуски по каждому спортсмену
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AthleteAttendanceSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `attendance.view` или группа вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /athletes/{id}/membership-periods:
    get:
      tags: [finance]
      summary: Расчетные периоды спортсмена за год
      description: |
        Учет ведется по календарным месяцам (BR-001). Возвращаются только
        существующие периоды: месяц заводится при обращении к нему.
      operationId: listMembershipPeriods
      parameters:
        - $ref: '#/components/parameters/AthleteId'
        - name: year
          in: query
          required: false
          description: По умолчанию текущий год
          schema:
            type: integer
            minimum: 2020
            maximum: 2100
      responses:
        '200':
          description: Периоды с оплатами
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipPeriodView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `payments.view` или спортсмен вне зоны доступа
            (`FORBIDDEN`). BR-010: ни одна роль, кроме суперадмина, этого права не
            имеет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /athletes/{id}/membership-periods/{year}/{month}:
    get:
      tags: [finance]
      summary: Расчетный период за месяц
      description: |
        Период создается при первом обращении: иначе администратор не увидел бы,
        что месяц не заведен, и не смог бы внести оплату. Статус периода
        выводится из суммы оплат и ручной отметки, а не задается вручную.
      operationId: getMembershipPeriod
      parameters:
        - $ref: '#/components/parameters/AthleteId'
        - name: year
          in: path
          required: true
          schema:
            type: integer
            example: 2026
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Период с оплатами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.view` или спортсмен вне доступа (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Спортсмен не найден (`ATHLETE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /membership-periods/{periodId}:
    patch:
      tags: [finance]
      summary: Изменить ожидаемую сумму и заметку периода
      description: |
        BR-002: сумма вводится вручную. Для нового спортсмена, пришедшего в
        середине месяца, она может быть любой; `null` снимает ожидание.
      operationId: updateMembershipPeriod
      parameters:
        - name: periodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipPeriodRequest'
      responses:
        '200':
          description: Период обновлен и пересчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Период не найден (`MEMBERSHIP_PERIOD_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /membership-periods/{periodId}/fully-paid:
    post:
      tags: [finance]
      summary: Отметить месяц оплаченным полностью
      description: |
        BR-003: суперадминистратор может отметить месяц оплаченным независимо от
        суммы — в клубе бывают расчеты вне системы. Отметка имеет приоритет над
        суммой и снимается тем же запросом с `marked: false`.
      operationId: markPeriodFullyPaid
      parameters:
        - name: periodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkFullyPaidRequest'
      responses:
        '200':
          description: Отметка поставлена или снята; статус пересчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Период не найден (`MEMBERSHIP_PERIOD_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /membership-periods/{periodId}/payments:
    post:
      tags: [finance]
      summary: Внести оплату
      description: |
        Сумма произвольная (BR-002). При наличии `idempotencyKey` повторная
        отправка возвращает текущее состояние периода, а не создает вторую
        оплату.
      operationId: recordPayment
      parameters:
        - name: periodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequest'
      responses:
        '201':
          description: Оплата внесена; период пересчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`) или сумма не больше нуля
            (`PAYMENT_AMOUNT_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Период не найден (`MEMBERSHIP_PERIOD_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /membership-periods/{periodId}/refunds:
    post:
      tags: [finance]
      description: |
        ADR-0010: возврат — отдельное движение средств, а не удаление
        поступления. Деньги сначала поступили, потом были возвращены, и оба
        факта остаются в истории (BR-007).

        Зачтено = поступления − возвраты, поэтому возврат уменьшает `paidAmount`
        и может вернуть период в `UNPAID` (полный возврат) или
        `PARTIALLY_PAID`. Ручная отметка «оплачен полностью» сохраняет приоритет
        (BR-003).

        Сумма возврата не может превысить поступления: по привязанному
        поступлению проверяется его сумма, по периоду — сумма всех поступлений.
        При наличии `idempotencyKey` повторная отправка возвращает текущее
        состояние периода, а не создает второй возврат.
      summary: Оформить возврат денег
      operationId: refundPayment
      parameters:
        - name: periodId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '201':
          description: Возврат оформлен; период пересчитан по нетто
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '400':
          description: |
            Ошибка валидации (`VALIDATION_FAILED`), сумма не больше нуля
            (`PAYMENT_AMOUNT_INVALID`), возврат больше полученного
            (`REFUND_EXCEEDS_PAYMENT`) или возврат относится к поступлению
            другого периода (`REFUND_PAYMENT_MISMATCH`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Период не найден (`MEMBERSHIP_PERIOD_NOT_FOUND`) или указанное
            поступление не найдено (`PAYMENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /payments/{paymentId}:
    patch:
      tags: [finance]
      summary: Изменить оплату
      description: Изменение пересчитывает статус периода.
      operationId: updatePayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
      responses:
        '200':
          description: Период после пересчета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Оплата не найдена (`PAYMENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [finance]
      summary: Отменить оплату
      description: |
        Запись удаляется, период пересчитывается: ошибка ввода не должна
        оставаться в истории как факт поступления денег.

        ADR-0010: если по поступлению есть возвраты, отмена отклоняется
        (`PAYMENT_HAS_REFUNDS`) — возврат потерял бы основание.
      operationId: voidPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Оплата удалена, период пересчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Оплата не найдена (`PAYMENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: По оплате есть возвраты (`PAYMENT_HAS_REFUNDS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /refunds/{refundId}:
    delete:
      tags: [finance]
      summary: Отменить возврат
      description: |
        ADR-0010: ошибочно оформленный возврат удаляется, период
        пересчитывается — возврат, сделанный по ошибке, не должен уменьшать
        зачтенную сумму. Это отдельный маршрут: возврат не является оплатой, и
        «отменить оплату» на него не действует.
      operationId: voidRefund
      parameters:
        - name: refundId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Возврат удален, период пересчитан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPeriodView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Возврат не найден (`REFUND_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /debts:
    get:
      tags: [finance]
      summary: Список должников за месяц
      description: |
        BR-004: спортсмен считается должником, если он активен; месяц не отмечен
        как полностью оплаченный; в месяце уже была хотя бы одна тренировка его
        группы; он не в заморозке.

        Задолженность оценивается **на начало месяца**. Рассматриваются только
        спортсмены с членством в этом месяце: иначе список заполнился бы всеми
        спортсменами клуба.

        Для не-должников возвращается причина освобождения: руководителю важно
        отличать решение (заморозка, отметка об оплате) от отсутствия данных.
      operationId: listDebtors
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Должники сверху; для остальных указана причина
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DebtorSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `payments.view` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /finance/summary:
    get:
      tags: [finance]
      summary: Сводка финансов за месяц
      description: |
        Основа dashboard руководителя (F8). Два разных знаменателя считаются
        осознанно:

        - **выручка — по датам движений**: это отчет о том, сколько денег прошло
          в этом месяце, включая оплаты за прошлые периоды. Начисление за месяц и
          деньги, полученные в месяце, — разные вопросы;
        - **задолженность — по расчетному месяцу** (BR-004): долг за сентябрь
          остается сентябрьским, даже если его закрыли в октябре.

        Филиал берется у группы спортсмена. Спортсмен без группы или без
        филиала попадает в отдельную строку «Филиал не назначен»: приписать его
        суммы первому филиалу значило бы показать чужие деньги как свои.
        Филиалы без движения и без должников не возвращаются.
      operationId: getFinanceSummary
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            example: 2026
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Сводка с разбивкой по филиалам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `payments.view` (`FORBIDDEN`). BR-010: в сводке суммы
            выручки и задолженности, поэтому `analytics.view` недостаточно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /news:
    get:
      tags: [news]
      summary: Список новостей клуба
      description: |
        BR-011: новости и комментарии видны всем пользователям клуба, поэтому
        **права на чтение нет** — список доступен любому аутентифицированному
        пользователю (ADR-0011).

        Черновики видит только автор и те, у кого есть `news.edit` или
        `news.moderate`. Фильтр применяется в запросе к БД, а не после выборки,
        иначе черновик попадал бы в ответ и оставался только «не показанным».

        Архивные записи не возвращаются без `includeArchived`: архив — это
        «убрать из ленты», а не «удалить из истории».
      operationId: listNews
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NewsStatus'
        - name: search
          in: query
          required: false
          description: Поиск по заголовку и тексту
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 'Новости: закрепленные и свежие сверху'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NewsPostView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [news]
      summary: Создать новость или черновик
      description: |
        Требует `news.create`: по роли это право не выдается, публикация —
        индивидуальная выдача (docs/05-user-stories.md: «тренер **с правом**
        публикует новости»). Без `publish: true` новость остается черновиком и
        видна только автору.
      operationId: createNewsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewsPostRequest'
      responses:
        '201':
          description: Новость создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPostView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `news.create` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /news/{id}:
    get:
      tags: [news]
      summary: Новость с комментариями
      description: |
        Чужой черновик отдает 404, а не 403: иначе по коду ответа можно было бы
        узнать, что неопубликованная новость существует.
      operationId: getNewsPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Карточка новости с комментариями
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPostDetails'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Новость не найдена или это чужой черновик (`NEWS_POST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [news]
      summary: Изменить новость
      description: |
        Автор правит свою новость; чужую — только с `news.edit`. Архивную новость
        править нельзя (`NEWS_POST_STATE_INVALID`): архив — история, а правка
        изменила бы то, что уже прочитали.
      operationId: updateNewsPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNewsPostRequest'
      responses:
        '200':
          description: Новость обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPostView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Это чужая новость и нет права `news.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Новость не найдена (`NEWS_POST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Новость в архиве (`NEWS_POST_STATE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [news]
      summary: Архивировать новость
      description: |
        Требует `news.delete`. Новость убирается из ленты, но остается в истории:
        архив — не удаление. Повторное архивирование отклоняется
        (`NEWS_POST_STATE_INVALID`).
      operationId: archiveNewsPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Новость в архиве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPostView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `news.delete` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Новость не найдена (`NEWS_POST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Новость уже в архиве (`NEWS_POST_STATE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /news/{id}/publish:
    post:
      tags: [news]
      summary: Опубликовать новость
      description: |
        Автор публикует свою новость, чужую — только с `news.edit`. Повторная
        публикация не «омолаживает» новость: сохраняется дата первой публикации.
      operationId: publishNewsPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Новость опубликована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsPostView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Это чужая новость и нет права `news.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Новость не найдена (`NEWS_POST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Новость в архиве (`NEWS_POST_STATE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /news/{id}/comments:
    post:
      tags: [news]
      summary: Прокомментировать новость
      description: |
        Комментировать может любой аутентифицированный пользователь: BR-011
        объединяет новости и комментарии, и если бы комментарии были доступны
        только части ролей, обсуждение распалось бы на две аудитории.

        Комментировать можно только опубликованное (`NEWS_NOT_PUBLISHED`):
        у черновика нет аудитории, а архивная новость — история.
      operationId: addNewsComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNewsCommentRequest'
      responses:
        '201':
          description: Комментарий добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsCommentView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Новость не найдена или это чужой черновик (`NEWS_POST_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Новость не опубликована (`NEWS_NOT_PUBLISHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /news-comments/{commentId}:
    delete:
      tags: [news]
      summary: Удалить комментарий
      description: |
        Свой комментарий удаляет автор, любой — пользователь с `news.moderate`.
        Иначе пришлось бы либо запретить автору исправлять сказанное, либо
        разрешить стирать чужие слова любому.

        Удаление мягкое: в ветке остается след, что комментарий был, иначе ответы
        на него теряют смысл. Отдельный маршрут, а не `DELETE /news/comments/{id}`:
        вложенный путь перехватывался бы `GET /news/{id}`.
      operationId: deleteNewsComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Комментарий удален
          content:
            application/json:
              schema:
                type: object
                required: [id, isDeleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  isDeleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Чужой комментарий без права `news.moderate` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Комментарий не найден или уже удален (`NEWS_COMMENT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /conversations:
    get:
      tags: [chat]
      summary: Диалоги пользователя
      description: |
        BR-012: групповые чаты своих групп и личные переписки.

        **Права на доступ не требуются**: матрица прав описывает чат как ресурс
        («own conversations» для MEMBER, «assigned conversations» для STAFF), а не
        как capability. Доступ определяется участием в диалоге. Требование
        `chat.use` здесь противоречило бы матрице: у MEMBER базовых прав нет, и
        родитель не смог бы написать тренеру, хотя BR-012 это разрешает.

        **Групповые чаты появляются лениво** (ADR-0012): чат группы создается в
        момент первого обращения участника, а состав участников пересчитывается по
        группе и дописывается. Поэтому пустой чат не виден никому, а новый
        спортсмен группы получает доступ без действий администратора.
      operationId: listConversations
      responses:
        '200':
          description: 'Диалоги: свежие сверху, с числом непрочитанных'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [chat]
      summary: Открыть диалог
      description: |
        Ровно одно из двух: `groupId` для чата группы или `participantIds` для
        личного диалога с одним собеседником (BR-012, ADR-0012).

        Повторный запрос возвращает существующий диалог, а не создает второй:
        иначе у пары копились бы параллельные переписки с одинаковым составом.

        Групповой чат доступен только тренерам группы и представителям ее
        спортсменов: посторонний не должен получить переписку по идентификатору
        группы.
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Диалог открыт (существующий или только что созданный)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationView'
        '400':
          description: |
            Указано и `groupId`, и `participantIds` (`CONVERSATION_TYPE_INVALID`)
            или собеседников не один (`CONVERSATION_PARTICIPANTS_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Чат группы недоступен вызывающему (`CONVERSATION_ACCESS_DENIED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Группа не найдена (`CONVERSATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /conversations/{id}:
    get:
      tags: [chat]
      summary: История диалога
      description: |
        Сообщения от старых к новым. **Чтение сдвигает `lastReadAt`**: после этого
        диалог не числится непрочитанным.

        Страница ограничена 50 сообщениями; `olderCursor` отдается, только если
        страница заполнена целиком, — иначе клиент делал бы лишний запрос за
        пустой страницей.

        Диалог, в котором вызывающий не участвует, отдает 404, а не 403: по коду
        ответа нельзя выяснить, существует ли чужая переписка.
      operationId: getConversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: olderThan
          in: query
          required: false
          description: Курсор — отдать сообщения старше этой даты (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Диалог с историей сообщений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetails'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Диалог не найден или недоступен (`CONVERSATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /conversations/{id}/messages:
    post:
      tags: [chat]
      summary: Отправить сообщение
      description: |
        Только участник диалога, и проверка выполняется на каждом запросе: состав
        группы может измениться между открытием списка и отправкой (ADR-0012).

        Отправка не пишется в аудит: BR-007 перечисляет оплаты, заморозки, права и
        расписание, а переписка — не тот случай, когда нужен след в аудите.
      operationId: sendMessage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '201':
          description: Сообщение отправлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageView'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Диалог не найден или недоступен (`CONVERSATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /messages/{messageId}:
    delete:
      tags: [chat]
      summary: Удалить свое сообщение
      description: |
        Удаляет только отправитель: модерации чужих сообщений в MVP нет, для нее
        понадобилось бы отдельное право, которого нет в каталоге (ADR-0012).

        Удаление мягкое: `deletedAt` сохраняется, текст больше не отдается, а в
        переписке остается след, что сообщение было. Иначе ответы на него теряли
        бы смысл.

        Отдельный маршрут, а не `DELETE /conversations/messages/{id}`: вложенный
        путь перехватывался бы `GET /conversations/{id}`.
      operationId: deleteMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Сообщение помечено удаленным
          content:
            application/json:
              schema:
                type: object
                required: [id, isDeleted]
                properties:
                  id:
                    type: string
                    format: uuid
                  isDeleted:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Это чужое сообщение (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: |
            Сообщение не найдено, уже удалено (`MESSAGE_NOT_FOUND`) или его диалог
            недоступен (`CONVERSATION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /athletes/{id}/freezes:
    get:
      tags: [freezes]
      summary: Заморозки спортсмена
      description: История заморозок, новые сверху.
      operationId: listFreezes
      parameters:
        - $ref: '#/components/parameters/AthleteId'
      responses:
        '200':
          description: История заморозок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FreezeView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Нет права `freezes.view` или спортсмен вне зоны доступа (`FORBIDDEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [freezes]
      summary: Открыть заморозку
      description: |
        BR-005: заморозка — открытый период приостановления; дату начала можно
        внести задним числом. Второй открытый период отклоняется
        (`FREEZE_ALREADY_OPEN`): иначе нельзя понять, когда приостановка
        закончилась.
      operationId: openFreeze
      parameters:
        - $ref: '#/components/parameters/AthleteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFreezeRequest'
      responses:
        '201':
          description: Заморозка открыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeView'
        '400':
          description: Некорректная дата (`FREEZE_PERIOD_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `freezes.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Спортсмен не найден (`ATHLETE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: У спортсмена уже есть открытая заморозка (`FREEZE_ALREADY_OPEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /freezes/{freezeId}/close:
    post:
      tags: [freezes]
      summary: Завершить заморозку
      description: |
        Дату окончания тоже можно внести задним числом: заморозку часто
        закрывают постфактум, когда спортсмен вернулся. Дата раньше начала
        отклоняется (`FREEZE_PERIOD_INVALID`).
      operationId: closeFreeze
      parameters:
        - name: freezeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseFreezeRequest'
      responses:
        '200':
          description: Заморозка закрыта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreezeView'
        '400':
          description: Некорректный период (`FREEZE_PERIOD_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: Нет права `freezes.edit` (`FORBIDDEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Заморозка уже завершена (`FREEZE_NOT_OPEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из ответа `/auth/login` или `/auth/refresh`

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Идентификатор пользователя
      schema:
        type: string
        format: uuid

    BranchId:
      name: id
      in: path
      required: true
      description: Идентификатор филиала
      schema:
        type: string
        format: uuid

    TrainerId:
      name: id
      in: path
      required: true
      description: Идентификатор профиля тренера
      schema:
        type: string
        format: uuid

    AthleteId:
      name: id
      in: path
      required: true
      description: Идентификатор спортсмена
      schema:
        type: string
        format: uuid

    ScheduleTemplateId:
      name: id
      in: path
      required: true
      description: Идентификатор шаблона расписания
      schema:
        type: string
        format: uuid

    TrainingSessionId:
      name: id
      in: path
      required: true
      description: Идентификатор занятия
      schema:
        type: string
        format: uuid

    GroupId:
      name: id
      in: path
      required: true
      description: Идентификатор группы
      schema:
        type: string
        format: uuid

  responses:
    ValidationFailed:
      description: Ошибка валидации входных данных (`VALIDATION_FAILED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: |
        Требуется access-токен или он недействителен (`UNAUTHENTICATED`).
        В заголовке `WWW-Authenticate` клиент получает требование Bearer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ресурс не найден (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Превышен лимит запросов (`RATE_LIMITED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Зависимость недоступна (`SERVICE_UNAVAILABLE`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      description: Единый формат ошибки (`docs/09-api.md`)
      required: [code, message]
      properties:
        code:
          type: string
          description: Стабильный машиночитаемый код
          example: SCHEDULE_CONFLICT
        message:
          type: string
          description: Текст для человека
          example: Занятие пересекается с другим в этом зале
        details:
          type: object
          additionalProperties: true
          description: Дополнительные сведения; состав зависит от кода
          example:
            missingPermissions: [payments.edit]
        requestId:
          type: string
          description: Идентификатор запроса для сопоставления с логами
          example: 6f1c2f0a-6f2e-4f4a-9d0e-3f1b2c3d4e5f

    ErrorCode:
      type: string
      description: |
        Реализованные коды ошибок. Список полный для текущих эндпоинтов;
        он расширяется по мере реализации модулей.
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
        - EMAIL_ALREADY_EXISTS
        - INVITE_INVALID
        - INVITE_EXPIRED
        - INVITE_ALREADY_USED
        - INVITE_EMAIL_MISMATCH
        - USER_BLOCKED
        - PERMISSION_UNKNOWN
        - PERMISSION_GRANTED_BY_ROLE
        - PERMISSION_IS_ROLE_BASED
        - PERMISSION_NOT_GRANTED
        - PERMISSION_EXPIRES_IN_PAST
        - BRANCH_NOT_FOUND
        - BRANCH_ARCHIVED
        - HALL_NOT_FOUND
        - HALL_NOT_IN_BRANCH
        - TRAINER_NOT_FOUND
        - TRAINER_ALREADY_ASSIGNED
        - ATHLETE_NOT_FOUND
        - ATHLETE_ARCHIVED
        - ACCOUNT_ALREADY_LINKED
        - ACCOUNT_NOT_LINKED
        - ACTIVE_MEMBERSHIP_EXISTS
        - GROUP_NOT_FOUND
        - GROUP_ARCHIVED
        - GROUP_TRAINER_ALREADY_ASSIGNED
        - GROUP_TRAINER_NOT_ASSIGNED
        - GROUP_BRANCH_ALREADY_LINKED
        - GROUP_BRANCH_NOT_LINKED
        - ATHLETE_ALREADY_MEMBER
        - MEMBERSHIP_NOT_FOUND
        - SCHEDULE_TEMPLATE_NOT_FOUND
        - SCHEDULE_TEMPLATE_EXISTS
        - SCHEDULE_TEMPLATE_ALREADY_PUBLISHED
        - SCHEDULE_TEMPLATE_PUBLISHED
        - SCHEDULE_TEMPLATE_EMPTY
        - SLOT_OVERLAPS_TEMPLATE
        - SCHEDULE_SLOT_INVALID_TIME
        - TRAINING_SESSION_NOT_FOUND
        - TRAINING_SESSION_CANCELLED
        - TRAINING_SESSION_CONFLICT
        - TRAINER_BUSY
        - HALL_BUSY
        - SESSION_ALREADY_STARTED
        - ATTENDANCE_ALREADY_RECORDED
        - ATTENDANCE_NOT_FOUND
        - ATHLETE_NOT_IN_GROUP
        - PLANNED_ABSENCE_EXISTS
        - PLANNED_ABSENCE_NOT_FOUND
        - MEMBERSHIP_PERIOD_NOT_FOUND
        - PAYMENT_NOT_FOUND
        - PAYMENT_AMOUNT_INVALID
        - FREEZE_ALREADY_OPEN
        - FREEZE_PERIOD_INVALID
        - FREEZE_NOT_OPEN

    PermissionCode:
      type: string
      description: Право из каталога (`docs/04-roles-permissions.md`)
      enum:
        - athletes.view
        - athletes.edit
        - athletes.contacts.view
        - groups.view
        - groups.edit
        - attendance.view
        - attendance.edit
        - schedule.view
        - schedule.edit
        - schedule.cancel
        - schedule.change_trainer
        - schedule.change_location
        - payments.view
        - payments.edit
        - freezes.view
        - freezes.edit
        - news.create
        - news.edit
        - news.delete
        - news.moderate
        - chat.use
        - branches.view
        - branches.manage
        - users.manage
        - permissions.manage
        - analytics.view

    UserRole:
      type: string
      description: Базовая роль (`docs/04-roles-permissions.md`)
      enum: [MEMBER, STAFF, SUPERADMIN]

    UserStatus:
      type: string
      enum: [INVITED, ACTIVE, BLOCKED]

    AthleteStatus:
      type: string
      description: Статус карточки спортсмена (BR-006)
      enum: [ACTIVE, FROZEN, ARCHIVED]

    Gender:
      type: string
      enum: [MALE, FEMALE, UNSPECIFIED]

    LivenessReport:
      type: object
      required: [status, service, environment, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: octagon-api
        environment:
          type: string
          enum: [local, test, staging, production]
        version:
          type: string
          example: 0.0.0
        uptimeSeconds:
          type: integer
          example: 185
        clubTimezone:
          type: string
          description: Локальная timezone клуба из конфигурации
          example: Asia/Almaty
        timestamp:
          type: string
          format: date-time

    ReadinessReport:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                example: database
              status:
                type: string
                enum: [up, down]
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 10

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Не задан — выход не меняет состояние

    AuthTokens:
      type: object
      required: [accessToken, expiresIn, refreshToken, refreshExpiresAt]
      properties:
        accessToken:
          type: string
          description: Короткоживущий access-токен (JWT)
        expiresIn:
          type: integer
          description: Время жизни access-токена в секундах
          example: 900
        refreshToken:
          type: string
          description: Refresh-токен; в БД хранится только его хеш
        refreshExpiresAt:
          type: string
          format: date-time

    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AuthTokens'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/UserProfile'

    UserPermissionGrant:
      type: object
      required: [code, description, isFinancial, grantedAt]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        description:
          type: string
          example: Просмотр оплат
        isFinancial:
          type: boolean
          description: Финансовое право — особо защищенное (BR-010)
        grantedAt:
          type: string
          format: date-time
        grantedById:
          type: string
          format: uuid
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Не задан — выдача бессрочная

    UserPermissions:
      type: object
      required: [codes, grants]
      properties:
        codes:
          type: array
          description: Итоговый набор прав (роль плюс действующие выдачи)
          items:
            $ref: '#/components/schemas/PermissionCode'
        grants:
          type: array
          description: Только выданные лично права
          items:
            type: object
            required: [code, grantedAt]
            properties:
              code:
                $ref: '#/components/schemas/PermissionCode'
              grantedAt:
                type: string
                format: date-time

    UserProfile:
      type: object
      description: 'Профиль из `GET /me` (ADR-0007). Секреты и внутренние поля не отдаются.'
      required: [id, email, firstName, lastName, role, status, scopeAllGroups, permissions]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        scopeAllGroups:
          type: boolean
          description: |
            true — сотрудник видит все группы, а не только свои (ADR-0006).
        permissions:
          $ref: '#/components/schemas/UserPermissions'

    LinkedAthlete:
      type: object
      required: [id, firstName, lastName, status, relation, isPrimary]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
          description: Календарная дата без времени
        status:
          $ref: '#/components/schemas/AthleteStatus'
        relation:
          type: string
          description: Тип связи аккаунта со спортсменом
          example: PARENT
        isPrimary:
          type: boolean

    CreateInviteRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/UserRole'

    UserInviteView:
      type: object
      description: Приглашение без токена и его хеша
      required: [id, email, role, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserInviteCreated:
      allOf:
        - $ref: '#/components/schemas/UserInviteView'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                Токен приглашения. Возвращается только при создании; в БД
                хранится его SHA-256-хеш. Передается пользователю вручную.
              example: 9f8c1d2e3a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5

    UserInvitePreview:
      type: object
      description: |
        Что видно по токену приглашения до его принятия. Отдается публично, поэтому
        в ответе минимум: адрес, роль и срок.
      required: [email, role, expiresAt]
      properties:
        email:
          type: string
          format: email
          description: Адрес, на который выдано приглашение; форма его показывает
        role:
          $ref: '#/components/schemas/UserRole'
        expiresAt:
          type: string
          format: date-time

    AcceptInviteRequest:
      type: object
      required: [email, password, firstName, lastName]
      description: Нужно указать ровно одно из `token` или `inviteId`
      properties:
        token:
          type: string
          minLength: 16
          description: Токен приглашения из ответа на создание
        inviteId:
          type: string
          format: uuid
          description: Идентификатор приглашения (альтернатива токену)
        email:
          type: string
          format: email
          maxLength: 254
          description: Должен совпадать с адресом приглашения
        password:
          type: string
          minLength: 8
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 32

    InviteAcceptance:
      type: object
      required: [userId, email, role]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'

    GrantPermissionRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Не задан — выдача бессрочная; срок в прошлом отклоняется

    UserPermissionsView:
      type: object
      description: |
        Права раздельно: базовый набор роли, индивидуальные выдачи и итог.
        Разделение нужно админке, чтобы показать, что выдано вручную.
      required:
        [userId, email, firstName, lastName, role, scopeAllGroups, rolePermissions, grants, effective]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: Экран прав открывается по идентификатору, поэтому имя включено в ответ
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        scopeAllGroups:
          type: boolean
        rolePermissions:
          type: array
          description: Права, которые дает роль
          items:
            $ref: '#/components/schemas/PermissionCode'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/UserPermissionGrant'
        effective:
          type: array
          description: Итоговый действующий набор прав
          items:
            $ref: '#/components/schemas/PermissionCode'

    BranchView:
      type: object
      required: [id, name, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BranchDetails:
      allOf:
        - $ref: '#/components/schemas/BranchView'
        - type: object
          required: [halls]
          properties:
            halls:
              type: array
              items:
                $ref: '#/components/schemas/HallView'

    HallView:
      type: object
      required: [id, branchId, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        name:
          type: string
        capacity:
          type: integer
          nullable: true
        isActive:
          type: boolean

    TrainerView:
      type: object
      description: |
        Профиль тренера. `userId` может быть null: часть тренеров работает без
        входа в систему (docs/04-roles-permissions.md).
      required: [id, displayName, isActive]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        displayName:
          type: string
        phone:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        isActive:
          type: boolean

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 32

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
        phone:
          type: string
          maxLength: 32
        isActive:
          type: boolean

    CreateHallRequest:
      type: object
      required: [branchId, name]
      properties:
        branchId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 1000

    UpdateHallRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 1000
        isActive:
          type: boolean

    CreateTrainerRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        bio:
          type: string
          maxLength: 2000
        userId:
          type: string
          format: uuid
          description: Не обязателен; у аккаунта не должно быть другого профиля тренера

    UpdateTrainerRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        bio:
          type: string
          maxLength: 2000
        isActive:
          type: boolean

    AthleteView:
      type: object
      description: |
        Карточка спортсмена. `phone` и `email` равны null, если у вызывающего
        нет права `athletes.contacts.view`.
      required: [id, firstName, lastName, gender, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          $ref: '#/components/schemas/Gender'
        status:
          $ref: '#/components/schemas/AthleteStatus'
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AthleteDetails:
      allOf:
        - $ref: '#/components/schemas/AthleteView'
        - type: object
          properties:
            notes:
              type: string
              nullable: true
              description: Заметки клуба; в `/me/athletes` не отдаются
            linkedAccounts:
              type: array
              items:
                type: object
                required: [userId, email, relation, isPrimary]
                properties:
                  userId:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                  relation:
                    type: string
                    example: PARENT
                  isPrimary:
                    type: boolean

    CreateAthleteRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date
          example: '2015-09-01'
        gender:
          $ref: '#/components/schemas/Gender'
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 2000

    UpdateAthleteRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        middleName:
          type: string
          maxLength: 100
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 254
        notes:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/AthleteStatus'

    LinkAccountRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
        relation:
          type: string
          maxLength: 32
          example: PARENT
          description: PARENT, GUARDIAN, SELF
        isPrimary:
          type: boolean
          description: Основной аккаунт спортсмена; он может быть один

    PaymentView:
      type: object
      description: |
        Транзакция по расчетному периоду: поступление или возврат (ADR-0010).
        Сумма всегда положительна, направление задает `kind`. Оба движения живут
        в одной ленте, потому что история периода читается подряд.
      required: [id, kind, amount, method, paidAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/PaymentKind'
        amount:
          type: number
          description: Сумма произвольная (BR-002); всегда положительна
          example: 25000
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paidAt:
          type: string
          format: date
        comment:
          type: string
          nullable: true
        refundedPaymentId:
          type: string
          format: uuid
          nullable: true
          description: |
            Поступление, к которому привязан возврат (только для `kind = REFUND`).
            null — корректировка периода без привязки к конкретному поступлению.
        createdById:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    MembershipPeriodView:
      type: object
      description: |
        Расчетный период за календарный месяц. Статус выводится из движений и
        ручной отметки, а не задается вручную. `paidAmount` — зачтено:
        поступления минус возвраты (ADR-0010).
      required: [id, athleteId, year, month, paidAmount, refundedAmount, status, payments]
      properties:
        id:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        expectedAmount:
          type: number
          nullable: true
          description: Ожидаемая сумма; может быть не задана (BR-002)
        paidAmount:
          type: number
          description: Зачтено = поступления − возвраты (ADR-0010)
        refundedAmount:
          type: number
          description: Сколько всего возвращено по периоду (ADR-0010)
        status:
          $ref: '#/components/schemas/MembershipPeriodStatus'
        fullyPaidMarkedAt:
          type: string
          format: date-time
          nullable: true
          description: Ручная отметка «оплачен полностью» (BR-003)
        fullyPaidMarkedById:
          type: string
          format: uuid
          nullable: true
        note:
          type: string
          nullable: true
        payments:
          type: array
          description: Лента движений периода — поступления и возвраты
          items:
            $ref: '#/components/schemas/PaymentView'

    MembershipPeriodStatus:
      type: string
      description: BR-001..BR-003 — статус расчетного периода
      enum: [UNPAID, PARTIALLY_PAID, PAID, FULLY_PAID_MARKED]

    PaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER, OTHER]

    PaymentKind:
      type: string
      description: ADR-0010 — направление движения средств
      enum: [PAYMENT, REFUND]

    FinanceTotals:
      type: object
      description: |
        Денежные итоги за период по датам движений. Начисление за месяц и
        деньги, полученные в месяце, — разные вопросы, поэтому выручка не
        смешивается с ожидаемыми суммами.
      required: [received, refunded, revenue]
      properties:
        received:
          type: number
          description: Поступления за период
        refunded:
          type: number
          description: Возвраты за период (ADR-0010)
        revenue:
          type: number
          description: Выручка = поступления − возвраты

    BranchFinanceSummary:
      type: object
      description: Денежные итоги филиала — для сравнения филиалов между собой
      required: [branchId, branchName, received, refunded, revenue, debtors, debt]
      properties:
        branchId:
          type: string
          format: uuid
          nullable: true
          description: |
            Основной филиал группы спортсмена. null — филиал не назначен: такие
            суммы сведены в отдельную строку, чтобы их не приняли за деньги
            конкретного филиала.
        branchName:
          type: string
        received:
          type: number
        refunded:
          type: number
        revenue:
          type: number
        debtors:
          type: number
          description: Должников среди спортсменов филиала
        debt:
          type: number
          description: Сколько недостает по ожидаемым суммам

    FinanceSummary:
      type: object
      description: |
        Сводка финансов за месяц (F8). Выручка считается по датам движений,
        задолженность — по расчетному месяцу (BR-004).
      required: [year, month, totals, expected, debtors, debtorsWithoutExpected, debt, activeAthletes, branches]
      properties:
        year:
          type: integer
        month:
          type: integer
          minimum: 1
          maximum: 12
        totals:
          $ref: '#/components/schemas/FinanceTotals'
        expected:
          type: number
          description: Ожидается к оплате по расчетному месяцу
        debtors:
          type: number
        debtorsWithoutExpected:
          type: number
          description: |
            Должники без заданной ожидаемой суммы: им долг посчитать нельзя, и
            «нет долга» здесь означает не оплату, а незаполненное ожидание
        debt:
          type: number
          description: Недостает по ожидаемым суммам у должников
        activeAthletes:
          type: number
        branches:
          type: array
          description: |
            Разбивка по филиалам; филиалы без движения и без должников не
            возвращаются, чтобы пустые строки не мешали сравнению
          items:
            $ref: '#/components/schemas/BranchFinanceSummary'

    DebtorSummary:
      type: object
      description: |
        BR-004: `isDebtor` истинно, только если выполнены все четыре условия.
        `reason` заполняется для не-должников: руководителю важно отличать
        решение (заморозка, отметка об оплате) от отсутствия данных.
        `paidAmount` — зачтено (нетто), поэтому возвращенные деньги
        задолженность не закрывают (ADR-0010).
      required: [athleteId, firstName, lastName, year, month, paidAmount, refundedAmount, isDebtor]
      properties:
        athleteId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        year:
          type: integer
        month:
          type: integer
        paidAmount:
          type: number
        refundedAmount:
          type: number
        expectedAmount:
          type: number
          nullable: true
        isDebtor:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [INACTIVE, MARKED_FULLY_PAID, NO_TRAININGS_YET, FROZEN, null]

    NewsStatus:
      type: string
      description: BR-011 — статус новости; черновик виден автору и модератору
      enum: [DRAFT, PUBLISHED, ARCHIVED]

    ConversationType:
      type: string
      description: BR-012 — чат группы или личная переписка
      enum: [GROUP, DIRECT]

    ConversationMemberRole:
      type: string
      description: |
        Роль участника в диалоге. Отдается в интерфейс, потому что для родителя
        важно, отвечает ли ему тренер или другой родитель.
      enum: [MEMBER, TRAINER]

    ConversationMemberView:
      type: object
      required: [userId, firstName, lastName, role]
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/ConversationMemberRole'

    MessageView:
      type: object
      description: |
        Сообщение диалога. Удаление мягкое: `isDeleted: true` означает, что в
        переписке остался след, а `body` приходит пустым.
      required: [id, conversationId, sender, body, isDeleted, canDelete, createdAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        sender:
          $ref: '#/components/schemas/ConversationMemberView'
        body:
          type: string
        isDeleted:
          type: boolean
        canDelete:
          type: boolean
          description: Удалить может только отправитель (ADR-0012)
        createdAt:
          type: string
          format: date-time

    ConversationView:
      type: object
      required:
        - id
        - type
        - title
        - participants
        - unreadCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ConversationType'
        title:
          type: string
          description: |
            У группового чата — имя группы, у личного — имя собеседника: у личной
            переписки нет названия, которое можно было бы хранить.
        groupId:
          type: string
          format: uuid
          nullable: true
        participants:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMemberView'
        lastMessage:
          allOf:
            - $ref: '#/components/schemas/MessageView'
          nullable: true
        unreadCount:
          type: integer
          description: |
            Сообщения после `lastReadAt`, отправленные не текущим пользователем:
            считать «прочитано при отправке» нельзя (ADR-0012).
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    ConversationDetails:
      allOf:
        - $ref: '#/components/schemas/ConversationView'
        - type: object
          required: [messages, olderCursor]
          properties:
            messages:
              type: array
              description: Сообщения от старых к новым
              items:
                $ref: '#/components/schemas/MessageView'
            olderCursor:
              type: string
              format: date-time
              nullable: true
              description: |
                Курсор для загрузки более старых сообщений; `null` — история
                исчерпана.

    CreateConversationRequest:
      type: object
      description: |
        Ровно одно из двух: `groupId` или `participantIds` (ADR-0012).
      properties:
        groupId:
          type: string
          format: uuid
        participantIds:
          type: array
          description: |
            Собеседники личного диалога: ровно один, без текущего пользователя.
            Число собеседников проверяет сервис и отвечает
            `CONVERSATION_PARTICIPANTS_INVALID`.
          items:
            type: string
            format: uuid

    SendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000

    NewsAuthorView:
      type: object
      description: Автор новости или комментария; интерфейсу достаточно имени
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    NewsPostView:
      type: object
      required:
        - id
        - title
        - body
        - status
        - author
        - isPinned
        - createdAt
        - updatedAt
        - commentsCount
        - canEdit
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/NewsStatus'
        author:
          $ref: '#/components/schemas/NewsAuthorView'
        isPinned:
          type: boolean
          description: Закрепленная новость идет первой в ленте
        publishedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        commentsCount:
          type: integer
          description: Число неудаленных комментариев
        canEdit:
          type: boolean
          description: Может ли текущий пользователь править, публиковать или архивировать

    NewsCommentView:
      type: object
      description: |
        Комментарий к новости. Удаление мягкое: `isDeleted: true` означает, что в
        ветке остался след, а `body` приходит пустым.
      required: [id, newsPostId, author, body, isDeleted, canDelete, createdAt]
      properties:
        id:
          type: string
          format: uuid
        newsPostId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/NewsAuthorView'
        body:
          type: string
        isDeleted:
          type: boolean
        canDelete:
          type: boolean
          description: Свой комментарий — автор, любой — с правом `news.moderate`
        createdAt:
          type: string
          format: date-time

    NewsPostDetails:
      allOf:
        - $ref: '#/components/schemas/NewsPostView'
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/NewsCommentView'

    CreateNewsPostRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 10000
        publish:
          type: boolean
          default: false
          description: true — опубликовать сразу; иначе новость останется черновиком
        isPinned:
          type: boolean
          default: false

    UpdateNewsPostRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 10000
        isPinned:
          type: boolean

    CreateNewsCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    FreezeView:
      type: object
      description: BR-005 — заморозка как открытый период приостановления
      required: [id, athleteId, athleteName, startedOn, isOpen, createdAt]
      properties:
        id:
          type: string
          format: uuid
        athleteId:
          type: string
          format: uuid
        athleteName:
          type: string
        startedOn:
          type: string
          format: date
        endedOn:
          type: string
          format: date
          nullable: true
        reason:
          type: string
          nullable: true
        isOpen:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UpdateMembershipPeriodRequest:
      type: object
      properties:
        expectedAmount:
          type: number
          nullable: true
          minimum: 0
        note:
          type: string
          nullable: true
          maxLength: 500

    MarkFullyPaidRequest:
      type: object
      required: [marked]
      properties:
        marked:
          type: boolean
          description: true — отметить месяц оплаченным, false — снять отметку

    RecordPaymentRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0.01
          example: 25000
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paidAt:
          type: string
          format: date
        comment:
          type: string
          maxLength: 500
        idempotencyKey:
          type: string
          maxLength: 100
          description: Повторная отправка с тем же ключом не создаст вторую оплату

    UpdatePaymentRequest:
      type: object
      properties:
        amount:
          type: number
          minimum: 0.01
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paidAt:
          type: string
          format: date
        comment:
          type: string
          maxLength: 500

    RefundPaymentRequest:
      type: object
      description: |
        ADR-0010: возврат — отдельное движение средств, а не удаление
        поступления. Сумма всегда положительна; `paymentId` необязателен и
        позволяет привязать возврат к конкретному поступлению, по которому
        проверяется лимит.
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0.01
          description: Сумма возврата; не больше поступлений периода
          example: 10000
        refundedAt:
          type: string
          format: date
          description: Календарная дата возврата; по умолчанию сегодня
        reason:
          type: string
          maxLength: 500
          description: Причина возврата
          example: Спортсмен ушел из клуба
        paymentId:
          type: string
          format: uuid
          description: Поступление, к которому относится возврат
        method:
          $ref: '#/components/schemas/PaymentMethod'
        idempotencyKey:
          type: string
          maxLength: 100
          description: Повторная отправка с тем же ключом не создаст второй возврат

    CreateFreezeRequest:
      type: object
      required: [startedOn]
      properties:
        startedOn:
          type: string
          format: date
          description: Дату можно внести задним числом (BR-005)
          example: '2026-10-01'
        reason:
          type: string
          maxLength: 500

    CloseFreezeRequest:
      type: object
      required: [endedOn]
      properties:
        endedOn:
          type: string
          format: date
          description: Дату можно внести задним числом (BR-005)
          example: '2026-10-20'

    GroupView:
      type: object
      required: [id, name, isActive, activeMembersCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
        primaryBranchName:
          type: string
          nullable: true
          description: Основной филиал, если он назначен
        activeMembersCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupDetails:
      allOf:
        - $ref: '#/components/schemas/GroupView'
        - type: object
          required: [branches, trainers, members]
          properties:
            branches:
              type: array
              items:
                $ref: '#/components/schemas/GroupBranchView'
            trainers:
              type: array
              items:
                $ref: '#/components/schemas/GroupTrainerView'
            members:
              type: array
              items:
                $ref: '#/components/schemas/GroupMemberView'

    GroupBranchView:
      type: object
      required: [branchId, branchName, isPrimary]
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        isPrimary:
          type: boolean

    GroupTrainerView:
      type: object
      required: [trainerId, displayName, isPrimary, assignedAt]
      properties:
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера
        displayName:
          type: string
        isPrimary:
          type: boolean
        assignedAt:
          type: string
          format: date-time

    GroupMemberView:
      type: object
      required: [athleteId, firstName, lastName, status, joinedAt]
      properties:
        athleteId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: '#/components/schemas/AthleteStatus'
        joinedAt:
          type: string
          format: date

    ActiveMembershipView:
      type: object
      nullable: true
      required: [membershipId, groupId, groupName, joinedAt]
      properties:
        membershipId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        joinedAt:
          type: string
          format: date

    UserView:
      type: object
      description: Пользователь в списке админки; пароль и токены не отдаются
      required: [id, email, firstName, lastName, role, status, scopeAllGroups, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        scopeAllGroups:
          type: boolean
          description: Доступ ко всем группам, а не только к назначенным
        createdAt:
          type: string
          format: date-time

    PaginatedUsers:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserView'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      required: [page, perPage, total, totalPages]
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    AttendanceStatus:
      type: string
      description: Итоговая посещаемость, подтвержденная тренером
      enum: [PRESENT, ABSENT, EXCUSED]

    AttendanceMarkView:
      type: object
      required: [athleteId, status, markedAt]
      properties:
        athleteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        comment:
          type: string
          nullable: true
        markedAt:
          type: string
          format: date-time
        markedById:
          type: string
          format: uuid
          nullable: true

    SessionRosterEntry:
      type: object
      description: |
        Спортсмен, числившийся в группе на дату занятия. Зачисленные позже и
        выбывшие раньше в журнал не попадают.
      required: [athleteId, firstName, lastName]
      properties:
        athleteId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        attendance:
          allOf:
            - $ref: '#/components/schemas/AttendanceMarkView'
          nullable: true
        plannedAbsence:
          type: object
          nullable: true
          description: Предупреждение родителя по BR-008; не заменяет отметку
          required: [reason, reportedAt]
          properties:
            reason:
              type: string
              nullable: true
            reportedAt:
              type: string
              format: date-time

    SessionAttendanceView:
      type: object
      required: [sessionId, groupId, groupName, startsAt, endsAt, status, roster, markedCount]
      properties:
        sessionId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TrainingSessionStatus'
        roster:
          type: array
          items:
            $ref: '#/components/schemas/SessionRosterEntry'
        markedCount:
          type: integer
          description: Сколько отметок уже подтверждено

    SaveAttendanceRequest:
      type: object
      required: [marks]
      properties:
        marks:
          type: array
          maxItems: 200
          items:
            type: object
            required: [athleteId, status]
            properties:
              athleteId:
                type: string
                format: uuid
              status:
                $ref: '#/components/schemas/AttendanceStatus'
              comment:
                type: string
                maxLength: 500

    ReportPlannedAbsenceRequest:
      type: object
      required: [athleteId]
      properties:
        athleteId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
          example: Поездка с семьей

    AthleteAttendanceSummary:
      type: object
      description: |
        `total` считается по занятиям, на которых спортсмен числился в составе:
        зачисление в середине квартала не портит статистику задним числом.
      required: [athleteId, total, present, absent, excused, unmarked]
      properties:
        athleteId:
          type: string
          format: uuid
        total:
          type: integer
        present:
          type: integer
        absent:
          type: integer
        excused:
          type: integer
        unmarked:
          type: integer
          description: Занятия без подтвержденной отметки

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000

    ScheduleSlotView:
      type: object
      description: |
        Регулярность группы: день недели и локальное время клуба. В БД время
        хранится типом `time`, а UTC-моменты вычисляются при материализации.
      required: [id, weekday, startTime, endTime]
      properties:
        id:
          type: string
          format: uuid
        weekday:
          $ref: '#/components/schemas/Weekday'
        startTime:
          type: string
          description: Локальное время клуба, HH:mm
          example: '18:00'
        endTime:
          type: string
          example: '19:30'
        hallId:
          type: string
          format: uuid
          nullable: true
        hallName:
          type: string
          nullable: true
        trainerId:
          type: string
          format: uuid
          nullable: true
          description: Идентификатор профиля тренера
        trainerName:
          type: string
          nullable: true

    ScheduleTemplateView:
      type: object
      required: [id, groupId, groupName, year, quarter, validFrom, validTo, slots]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        year:
          type: integer
        quarter:
          type: integer
          minimum: 1
          maximum: 4
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: После публикации слоты не меняются
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleSlotView'

    TrainingSessionView:
      type: object
      description: |
        Экземпляр занятия. Зал, тренер и филиал скопированы из шаблона при
        материализации, поэтому смена тренера в шаблоне не переписывает уже
        созданные занятия (BR-009).
      required: [id, groupId, groupName, startsAt, endsAt, status, fromTemplate]
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        branchId:
          type: string
          format: uuid
          nullable: true
        hallId:
          type: string
          format: uuid
          nullable: true
        hallName:
          type: string
          nullable: true
        trainerId:
          type: string
          format: uuid
          nullable: true
        trainerName:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TrainingSessionStatus'
        changeReason:
          type: string
          nullable: true
          description: Причина переноса или отмены
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        fromTemplate:
          type: boolean
          description: Занятие создано материализацией, а не добавлено вручную

    TrainingSessionStatus:
      type: string
      description: BR-009 — точечное изменение экземпляра занятия
      enum: [SCHEDULED, CANCELLED, MOVED]

    Weekday:
      type: string
      enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]

    CreateScheduleTemplateRequest:
      type: object
      required: [groupId, year, quarter]
      properties:
        groupId:
          type: string
          format: uuid
        year:
          type: integer
          minimum: 2020
          maximum: 2100
        quarter:
          type: integer
          minimum: 1
          maximum: 4

    AddScheduleSlotRequest:
      type: object
      required: [weekday, startTime, endTime]
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '18:00'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '19:30'
        hallId:
          type: string
          format: uuid
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера, а не аккаунта

    UpdateScheduleSlotRequest:
      type: object
      properties:
        weekday:
          $ref: '#/components/schemas/Weekday'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        hallId:
          type: string
          format: uuid
          nullable: true
        trainerId:
          type: string
          format: uuid
          nullable: true

    GenerateSessionsRequest:
      type: object
      properties:
        regenerate:
          type: boolean
          description: |
            Пересоздать занятия: удаляются только те, что еще не начались.
            Отмененные вручную занятия сохраняются.

    CreateSessionRequest:
      type: object
      description: |
        Занятие, добавленное вручную: задним числом или разово вне расписания.
        Время задается локальным временем клуба, а не UTC. Занятие не связано с
        шаблоном, поэтому пересоздание расписания его не затрагивает.
      required: [groupId, date, startTime, endTime, reason]
      properties:
        groupId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          example: '2026-10-07'
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '18:00'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Допускается переход через полночь
          example: '19:30'
        hallId:
          type: string
          format: uuid
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера, не аккаунта
        reason:
          type: string
          maxLength: 500
          description: Причина попадает в карточку занятия
          example: Занесение занятий за прошлый месяц

    GenerateSessionsResult:
      type: object
      required: [created, skipped, removed]
      properties:
        created:
          type: integer
        skipped:
          type: integer
          description: Уже существовавшие занятия (уникальность groupId + startsAt)
        removed:
          type: integer
          description: Удалено при пересоздании

    MoveSessionRequest:
      type: object
      required: [startsAt, endsAt, reason]
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        hallId:
          type: string
          format: uuid
          nullable: true
        trainerId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          maxLength: 500
          example: Карантин в школе

    CancelSessionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          example: Низкая температура в зале
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        isActive:
          type: boolean

    LinkGroupBranchRequest:
      type: object
      required: [branchId]
      properties:
        branchId:
          type: string
          format: uuid
        isPrimary:
          type: boolean
          description: Основной филиал группы; он может быть один

    AssignGroupTrainerRequest:
      type: object
      required: [trainerId]
      properties:
        trainerId:
          type: string
          format: uuid
          description: Идентификатор профиля тренера, а не аккаунта
        isPrimary:
          type: boolean
          description: Основной тренер группы; он может быть один

    AddGroupMemberRequest:
      type: object
      required: [athleteId]
      properties:
        athleteId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date
          description: Дата вступления; по умолчанию сегодня

security:
  - bearerAuth: []
