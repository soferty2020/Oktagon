name: octagon_mobile
description: "OCTAGON Club System — mobile app (docs/10-mobile-app.md)"
publish_to: 'none'

version: 0.1.0-rc.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Иконки Cupertino: часть Material-виджетов ссылается на них при сборке под
  # iOS, и без пакета сборка предупреждает об отсутствующих шрифтах.
  cupertino_icons: ^1.0.8

  # HTTP-клиент: стандартная библиотека + http покрывает нужды приложения.
  # Dio не берется намеренно: интерцепторы и повторные попытки здесь не нужны,
  # а лишняя зависимость усложняет обновление Flutter.
  http: ^1.2.2

  # Токены сессии хранятся в защищенном хранилище платформы (Keychain/Keystore),
  # а не в SharedPreferences: access и refresh токены дают доступ к данным клуба
  # (docs/15-security.md).
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Иконки приложения (#29). Источник — docs/design/brand/octagon-app-icon*.svg,
# PNG отрендерены из него; сами SVG и превью хранятся в docs/design/brand.
#
# Рамку и скругление не рисуем: их применяет платформа. Foreground для Android 8+
# содержит знак в safe zone, фон задаётся здесь же.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon-1024.png
  adaptive_icon_background: '#060607'
  adaptive_icon_foreground: assets/brand/app-icon-foreground-1024.png
  remove_alpha_ios: true
